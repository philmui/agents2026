<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Sequence diagram: app connects, sets output language, then loops mic append up and three deltas down">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- actor headers -->
  <g text-anchor="middle" font-weight="700" font-size="15">
    <rect x="40"  y="16" width="150" height="40" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="115" y="41" fill="#0f766e">You (mic)</text>
    <rect x="305" y="16" width="150" height="40" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="380" y="41" fill="#4338ca">translate.py</text>
    <rect x="570" y="16" width="160" height="40" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="650" y="41" fill="#be185d">gpt-realtime-translate</text>
  </g>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="115" y1="56" x2="115" y2="410"/>
    <line x1="380" y1="56" x2="380" y2="410"/>
    <line x1="650" y1="56" x2="650" y2="410"/>
  </g>

  <g font-size="13" fill="#334155" text-anchor="middle">
    <!-- connect -->
    <line x1="380" y1="82" x2="646" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
    <text x="513" y="74">connect .../translations</text>

    <!-- session.update -->
    <line x1="380" y1="116" x2="646" y2="116" stroke="#6366f1" stroke-width="2" marker-end="url(#ar)"/>
    <text x="513" y="108" fill="#4338ca" font-weight="700">session.update · output.language=es</text>
  </g>

  <!-- loop box -->
  <rect x="70" y="140" width="640" height="250" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M70 140 h74 v20 l-14 12 h-60 z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="82" y="157" font-size="12" font-weight="700" fill="#334155">loop</text>
  <text x="152" y="157" font-size="12" fill="#64748b">while speaking</text>

  <g font-size="13" text-anchor="middle">
    <!-- mic -> app -->
    <line x1="115" y1="190" x2="376" y2="190" stroke="#0d9488" stroke-width="2" marker-end="url(#ar)"/>
    <text x="245" y="182" fill="#0f766e">mic audio (PCM16)</text>

    <!-- app -> OAI append -->
    <line x1="380" y1="224" x2="646" y2="224" stroke="#0d9488" stroke-width="2" marker-end="url(#ar)"/>
    <text x="513" y="216" fill="#0f766e" font-weight="700">session.input_audio_buffer.append · audio</text>

    <!-- OAI -> app input transcript -->
    <line x1="650" y1="272" x2="384" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
    <text x="517" y="264" fill="#334155">session.input_transcript.delta · source</text>

    <!-- OAI -> app output transcript -->
    <line x1="650" y1="312" x2="384" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
    <text x="517" y="304" fill="#334155">session.output_transcript.delta · target</text>

    <!-- OAI -> app output audio -->
    <line x1="650" y1="360" x2="384" y2="360" stroke="#ec4899" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="517" y="352" fill="#be185d" font-weight="700">session.output_audio.delta · delta (play)</text>
  </g>
</svg>
