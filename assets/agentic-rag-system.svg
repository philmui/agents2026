<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG system with evaluation</title>
  <desc id="desc">A user question flows into an agent that plans, acts, and synthesizes. The agent retrieves information from an inspectable corpus or calls live tools, then returns an evidence-backed answer. The answer is evaluated for quality, grounding, and tool use, and those results improve the agent.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e11d48"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.4px; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .eyebrow { font: 700 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #64748b; }
      .node-title { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.15px; fill: #0f172a; }
      .node-copy { font: 400 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .agent-copy { font: 400 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .chip { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4338ca; }
      .connector { font: 700 10px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.6px; fill: #64748b; }
      .metric { font: 600 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #be123c; }
      .icon { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
      .indigo { fill: #4f46e5; }
      .green { fill: #15803d; }
      .teal { fill: #0f766e; }
      .rose { fill: #be123c; }
    </style>
  </defs>

  <!-- Canvas and heading -->
  <rect width="960" height="560" rx="24" fill="#f8fafc"/>
  <text x="56" y="52" class="title">From question to evidence-backed answer</text>
  <text x="56" y="80" class="subtitle">A clear view of how an agent gathers evidence, uses tools, and improves.</text>
  <text x="56" y="120" class="eyebrow">PRIMARY FLOW</text>

  <!-- Main connectors -->
  <path d="M244 226H294" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <path d="M646 226H696" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <text x="269" y="213" class="connector" text-anchor="middle">ASK</text>
  <text x="671" y="213" class="connector" text-anchor="middle">ANSWER</text>

  <!-- Question -->
  <g transform="translate(56 163)" filter="url(#shadow)">
    <rect width="188" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#eef2ff"/>
    <path class="icon" d="M29 29h16v11H35l-5 4v-4h-1z" stroke="#4f46e5"/>
    <text x="68" y="34" class="eyebrow indigo">INPUT</text>
    <text x="20" y="80" class="node-title">User question</text>
    <text x="20" y="104" class="node-copy">A task or information need</text>
  </g>

  <!-- Agent -->
  <g transform="translate(294 143)" filter="url(#shadow)">
    <rect width="352" height="166" rx="20" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <rect x="1" y="1" width="350" height="5" rx="3" fill="#6366f1"/>
    <rect x="20" y="22" width="34" height="34" rx="10" fill="#eef2ff"/>
    <path class="icon" d="M28 39h18M37 30v18M31 33l12 12M43 33L31 45" stroke="#4f46e5"/>
    <text x="68" y="36" class="eyebrow indigo">ORCHESTRATOR</text>
    <text x="20" y="82" class="node-title">Agent</text>
    <text x="20" y="104" class="agent-copy">Chooses the next best action from context</text>
    <g transform="translate(20 124)">
      <rect width="88" height="26" rx="13" fill="#eef2ff"/><text x="44" y="18" class="chip" text-anchor="middle">1 · Plan</text>
      <rect x="98" width="88" height="26" rx="13" fill="#eef2ff"/><text x="142" y="18" class="chip" text-anchor="middle">2 · Act</text>
      <rect x="196" width="116" height="26" rx="13" fill="#eef2ff"/><text x="254" y="18" class="chip" text-anchor="middle">3 · Synthesize</text>
    </g>
  </g>

  <!-- Answer -->
  <g transform="translate(696 163)" filter="url(#shadow)">
    <rect width="208" height="126" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#f0fdf4"/>
    <path class="icon" d="M28 37l6 6 12-13" stroke="#16a34a"/>
    <text x="68" y="34" class="eyebrow green">OUTPUT</text>
    <text x="20" y="80" class="node-title">Grounded answer</text>
    <text x="20" y="104" class="node-copy">Supported by returned evidence</text>
  </g>

  <!-- Evidence exchange -->
  <path d="M438 309V363" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M502 363V309" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="424" y="338" class="connector teal" text-anchor="end">RETRIEVE / CALL</text>
  <text x="516" y="338" class="connector teal">EVIDENCE / RESULTS</text>

  <!-- Evidence and actions panel -->
  <g transform="translate(56 363)">
    <rect width="584" height="149" rx="20" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="20" y="30" class="eyebrow teal">EVIDENCE &amp; ACTIONS</text>

    <g transform="translate(20 48)">
      <rect width="260" height="81" rx="14" fill="#ffffff" stroke="#ccfbf1"/>
      <rect x="14" y="15" width="32" height="32" rx="9" fill="#ccfbf1"/>
      <path class="icon" d="M21 23c0-3 18-3 18 0v15c0 3-18 3-18 0zm0 0c0 3 18 3 18 0m-18 7c0 3 18 3 18 0" stroke="#0f766e"/>
      <text x="58" y="31" class="node-title">Knowledge corpus</text>
      <text x="58" y="55" class="node-copy">Inspectable documents and data</text>
    </g>

    <g transform="translate(300 48)">
      <rect width="264" height="81" rx="14" fill="#ffffff" stroke="#ccfbf1"/>
      <rect x="14" y="15" width="32" height="32" rx="9" fill="#ccfbf1"/>
      <path class="icon" d="M21 24h18v14H21zm4 5l3 3-3 3m6 0h4" stroke="#0f766e"/>
      <text x="58" y="31" class="node-title">Live tools</text>
      <text x="58" y="55" class="node-copy">Search, APIs, data, or calculation</text>
    </g>
  </g>

  <!-- Evaluation path -->
  <path d="M800 289V363" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
  <text x="812" y="338" class="connector rose">EVALUATE</text>
  <g transform="translate(676 363)" filter="url(#shadow)">
    <rect width="228" height="149" rx="20" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
    <rect x="20" y="20" width="34" height="34" rx="10" fill="#fff1f2"/>
    <path class="icon" d="M27 39h5l3-10 5 17 3-7h5" stroke="#e11d48"/>
    <text x="68" y="34" class="eyebrow rose">FEEDBACK LOOP</text>
    <text x="20" y="80" class="node-title">Evaluate the answer</text>
    <text x="20" y="106" class="metric">QUALITY · GROUNDING · TOOL USE</text>
    <text x="20" y="130" class="node-copy">Use results to improve the agent</text>
  </g>

  <!-- Improvement feedback -->
  <path d="M676 473H658V329H608V309" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-rose)"/>
  <rect x="614" y="390" width="90" height="24" rx="12" fill="#fff1f2"/>
  <text x="659" y="406" class="connector rose" text-anchor="middle">IMPROVE</text>
</svg>
