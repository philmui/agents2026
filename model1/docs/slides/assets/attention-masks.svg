<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="attention-masks-title attention-masks-desc">
<title id="attention-masks-title">attention masks</title><desc id="attention-masks-desc">Rows are the token being updated, columns are the token it may read. Five tokens The river bank was muddy label both axes. An encoder permits all positions; a causal decoder permits only current and earlier columns. Check marks mean allowed; crosses mean blocked. For the bank row, the decoder can read The river bank but not was muddy.</desc>
