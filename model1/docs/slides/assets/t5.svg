<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="t5-title t5-desc">
<title id="t5-title">t5</title><desc id="t5-desc">Input text → Encoder → Decoder → Label text</desc>
