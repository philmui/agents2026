<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="70.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 01</text><g class="diagram-node"><rect x="70.0" y="115" width="312.5" height="280" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="226.25" y="213.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Input text</text><text x="226.25" y="287.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Classify this</text><text x="226.25" y="329.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">review…</text></g><path d="M390.5,250 L440.5,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#t5-arrow)"/><text x="452.5" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 02</text><g class="diagram-node"><rect x="452.5" y="115" width="312.5" height="280" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="608.75" y="213.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Encoder</text><text x="608.75" y="287.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Build contextual</text><text x="608.75" y="329.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">representations</text></g><path d="M773.0,250 L823.0,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#t5-arrow)"/><text x="835.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 03</text><g class="diagram-node"><rect x="835.0" y="115" width="312.5" height="280" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="991.25" y="213.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Decoder</text><text x="991.25" y="287.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Generate an output</text><text x="991.25" y="329.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">sequence</text></g><path d="M1155.5,250 L1205.5,250" fill="non