<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="request-response-title request-response-desc">
<title id="request-response-title">request response</title><desc id="request-response-desc">An API request specifies model, state, questions; the response reports model, answers, and usage.</desc>
<defs><marker id="request-response-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="60" y="65" width="680" height="350" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="400.0" y="198.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">REQUEST</text><text x="400.0" y="272.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">model, state, questions: instructions +</text><text x="400.0" y="314.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">criteria</text></g><path d="M770,240 L835,240" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#request-response-arrow)"/><g class="diagram-node"><rect x="865" y="65" width="680" height="350" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1205.0" y="219.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">RESPONSE</text><text x="1205.0" y="293.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">model, answers: choice / noul / score; usage</text></g></svg>