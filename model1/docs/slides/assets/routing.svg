<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="routing-title routing-desc">
<title id="routing-title">routing</title><desc id="routing-desc">Read Choice answer technical with top probability 0.80 and confidence 0.70. Explicit code checks confidence against an illustrative threshold 0.60. If confidence is at least 0.60, route to selected handler; otherwise review. The threshold needs development-set evidence.</desc>
<defs><marker id="routing-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="45" y="160" width="400" height="230" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="245.0" y="233.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Read the Choice answer</text><text x="245.0" y="307.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">technical · confidence</text><text x="245.0" y="349.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">0.70</text></g><path d="M465,275 L605,275" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#routing-arrow)"/><path d="M845,130 L1065,275 L845,420 L625,275 Z" fill="#f6e4da" stroke="#8b5137" stroke-width="2"/><text x="845" y="243" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">confidence</text><text x="845" y="309" font-size="38" fill="#26364a" text-anchor="middle" font-weight="600">≥ 0.60?</text><path d="M1085,255 L1200,115" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#routing-arrow)"/><path d="M1085,295 L1200,430" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#routing-arrow)"/><g class="diagram-node"><rect x="1230" y="45" width="325" height="160" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1392.5" y="104.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Selected handler</text><text x="1392.5" y="178.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Here: technical</text></g><g class="diagram-node"><rect x="1230" y="350" width="325" height="160" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="1392.5" y="409.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Review</text><text x="1392.5" y="483.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Ask or escalate</text></g><text x="1140" y="168" font-size="29" fill="#326657" text-anchor="middle" font-weight="600">yes</text><text x="1140" y="415" font-size="29" fill="#8b5137" text-anchor="middle" font-weight="600">no</text><text x="800" y="535" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">0.60 is an illustrative policy threshold. Choose yours on development data.</text></svg>