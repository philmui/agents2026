<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="good-questions-title good-questions-desc">
<title id="good-questions-title">good questions</title><desc id="good-questions-desc">Define one decision → Describe the boundaries → Add missing context → Test known cases</desc>
<defs><marker id="good-questions-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="70.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 01</text><g class="diagram-node"><rect x="70.0" y="115" width="312.5" height="280" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="226.25" y="209.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Define one</text><text x="226.25" y="259.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">decision</text><text x="226.25" y="333.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Which help team?</text></g><path d="M390.5,250 L440.5,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#good-questions-arrow)"/><text x="452.5" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 02</text><g class="diagram-node"><rect x="452.5" y="115" width="312.5" height="280" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="608.75" y="188.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Describe the</text><text x="608.75" y="238.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">boundaries</text><text x="608.75" y="312.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">What belongs in each</text><text x="608.75" y="354.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">category?</text></g><path d="M773.0,250 L823.0,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#good-questions-arrow)"/><text x="835.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 03</text><g class="diagram-node"><rect x="835.0" y="115" width="312.5" height="280" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="991.25" y="188.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Add missing</text><text x="991.25" y="238.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">context</text><text x="991.25" y="312.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Include an other</text><text x="991.25" y="354.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">category</text></g><path d="M1155.5,250 L1205.5,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#good-questions-arrow)"/><text x="1217.5" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 04</text><g class="diagram-node"><rect x="1217.5" y="115" width="312.5" height="280" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1373.75" y="213.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Test known cases</text><text x="1373.75" y="287.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Inspect errors and</text><text x="1373.75" y="329.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">ambiguity</text></g></svg>