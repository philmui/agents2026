<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="counts-title counts-desc">
<title id="counts-title">counts</title><desc id="counts-desc">The message screen screen frozen gives vocabulary counts: fee 0, frozen 1, meeting 0, screen 2, twice 0. The order of the five vocabulary positions stays fixed.</desc>
<defs><marker id="counts-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="800" y="70" font-size="39" fill="#3b587c" text-anchor="middle" font-weight="600">MESSAGE: “screen screen frozen”</text><rect x="70" y="140" width="260" height="270" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="200" y="195" font-size="24" fill="#3b587c" text-anchor="middle" font-weight="600">POSITION 0</text><text x="200" y="300" font-size="83" fill="#26364a" text-anchor="middle" font-weight="600">0</text><text x="200" y="385" font-size="31" fill="#26364a" text-anchor="middle" font-weight="400">fee</text><rect x="370" y="140" width="260" height="270" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="500" y="195" font-size="24" fill="#3b587c" text-anchor="middle" font-weight="600">POSITION 1</text><text x="500" y="300" font-size="83" fill="#26364a" text-anchor="middle" font-weight="600">1</text><text x="500" y="385" font-size="31" fill="#26364a" text-anchor="middle" font-weight="400">frozen</text><rect x="670" y="140" width="260" height="270" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="800" y="195" font-size="24" fill="#3b587c" text-anchor="middle" font-weight="600">POSITION 2</text><text x="800" y="300" font-size="83" fill="#26364a" text-anchor="middle" font-weight="600">0</text><text x="800" y="385" font-size="31" fill="#26364a" text-anchor="middle" font-weight="400">meeting</text><rect x="970" y="140" width="260" height="270" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1100" y="195" font-size="24" fill="#3b587c" text-anchor="middle" font-weight="600">POSITION 3</text><text x="1100" y="300" font-size="83" fill="#26364a" text-anchor="middle" font-weight="600">2</text><text x="1100" y="385" font-size="31" fill="#26364a" text-anchor="middle" font-weight="400">screen</text><rect x="1270" y="140" width="260" height="270" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1400" y="195" font-size="24" fill="#3b587c" text-anchor="middle" font-weight="600">POSITION 4</text><text x="1400" y="300" font-size="83" fill="#26364a" text-anchor="middle" font-weight="600">0</text><text x="1400" y="385" font-size="31" fill="#26364a" text-anchor="middle" font-weight="400">twice</text><text x="800" y="480" font-size="31" fill="#26364a" text-anchor="middle" font-weight="400">The vector is [0, 1, 0, 2, 0]. Its length stays fixed when messages get longer.</text></svg>