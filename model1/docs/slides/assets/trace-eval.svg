<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="trace-eval-title trace-eval-desc">
<title id="trace-eval-title">trace eval</title><desc id="trace-eval-desc">An ordered trace records user request, tool call, tool evidence, and final answer. The judge reads the recorded trace and returns focused typed judgments; evaluating against evidence is different from writing a plausible explanation.</desc>
<defs><marker id="trace-eval-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<circle cx="85" cy="67" r="25" fill="#3b587c"/><text x="85" y="77" font-size="29" fill="white" text-anchor="middle" font-weight="600">1</text><g class="diagram-node"><rect x="145" y="20" width="550" height="95" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="420.0" y="79.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">User request</text></g><path d="M85,95 L85,129" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#trace-eval-arrow)"/><circle cx="85" cy="192" r="25" fill="#3b587c"/><text x="85" y="202" font-size="29" fill="white" text-anchor="middle" font-weight="600">2</text><g class="diagram-node"><rect x="145" y="145" width="550" height="95" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="420.0" y="204.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Tool call</text></g><path d="M85,220 L85,254" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#trace-eval-arrow)"/><circle cx="85" cy="317" r="25" fill="#3b587c"/><text x="85" y="327" font-size="29" fill="white" text-anchor="middle" font-weight="600">3</text><g class="diagram-node"><rect x="145" y="270" width="550" height="95" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="420.0" y="329.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Tool evidence</text></g><path d="M85,345 L85,379" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#trace-eval-arrow)"/><circle cx="85" cy="442" r="25" fill="#3b587c"/><text x="85" y="452" font-size="29" fill="white" text-anchor="middle" font-weight="600">4</text><g class="diagram-node"><rect x="145" y="395" width="550" height="95" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="420.0" y="454.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Final answer</text></g><path d="M725,255 L850,255" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#trace-eval-arrow)"/><g class="diagram-node"><rect x="885" y="85" width="645" height="350" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1207.5" y="218.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Judge the whole recorded run</text><text x="1207.5" y="292.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Did the final answer use the evidence? Did</text><text x="1207.5" y="334.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">it satisfy the request?</text></g></svg>