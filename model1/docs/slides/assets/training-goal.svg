<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="training-goal-title training-goal-desc">
<title id="training-goal-title">training goal</title><desc id="training-goal-desc">Illustrative feedback encourages correct decisions with probabilities that match observed outcomes; not a reconstruction of RLCD.</desc>
<defs><marker id="training-goal-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="65" y="95" width="400" height="245" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="265.0" y="175.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Predict a decision</text><text x="265.0" y="249.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Include probability</text><text x="265.0" y="291.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">estimates.</text></g><path d="M485,215 L565,215" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#training-goal-arrow)"/><g class="diagram-node"><rect x="590" y="95" width="420" height="245" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="800.0" y="175.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Compare with outcomes</text><text x="800.0" y="249.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Check correctness and</text><text x="800.0" y="291.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">probability quality.</text></g><path d="M1030,215 L1110,215" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#training-goal-arrow)"/><g class="diagram-node"><rect x="1135" y="95" width="400" height="245" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="1335.0" y="175.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Improve with feedback</text><text x="1335.0" y="249.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">RLCD&#x27;s exact procedure is</text><text x="1335.0" y="291.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">proprietary.</text></g><text x="800" y="465" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">This is a teaching diagram of a training goal, not Jev&#x27;s internal architecture.</text></svg>