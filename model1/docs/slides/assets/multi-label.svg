<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="multi-label-title multi-label-desc">
<title id="multi-label-title">multi label</title><desc id="multi-label-desc">One Choice selects one category; separate Noul questions can identify several properties at once.</desc>
<defs><marker id="multi-label-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="60" y="90" width="550" height="310" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="335.0" y="203.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">A payment problem that is urgent</text><text x="335.0" y="277.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">One message can have several</text><text x="335.0" y="319.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">properties.</text></g><path d="M640,240 L830,103" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#multi-label-arrow)"/><g class="diagram-node"><rect x="865" y="40" width="655" height="130" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1192.5" y="84.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Topic: billing</text><text x="1192.5" y="158.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Choice selects one topic</text></g><path d="M640,240 L830,263" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#multi-label-arrow)"/><g class="diagram-node"><rect x="865" y="200" width="655" height="130" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1192.5" y="244.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Urgent? 0.9</text><text x="1192.5" y="318.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Noul for urgency</text></g><path d="M640,240 L830,423" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#multi-label-arrow)"/><g class="diagram-node"><rect x="865" y="360" width="655" height="130" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1192.5" y="404.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Frustrated? 0.7</text><text x="1192.5" y="478.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Separate Noul for frustration</text></g></svg>