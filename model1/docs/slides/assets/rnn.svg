<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="rnn-title rnn-desc">
<title id="rnn-title">rnn</title><desc id="rnn-desc">An unrolled RNN applies the same update cell three times. Initial state h0 and token not produce h1; h1 and very produce h2; h2 and helpful produce h3; the final state feeds a classification head.</desc>
<defs><marker id="rnn-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="800" y="50" font-size="29" fill="#3b587c" text-anchor="middle" font-weight="600">ONE UPDATE RULE, REUSED AT EACH POSITION</text><text x="40" y="260" font-size="38" fill="#3b587c" text-anchor="start" font-weight="600">h₀</text><g class="diagram-node"><rect x="160" y="145" width="290" height="195" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="305.0" y="200.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Update cell</text><text x="305.0" y="274.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Earlier state +</text><text x="305.0" y="316.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">this token</text></g><path d="M90,242 L145,242" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#rnn-arrow)"/><text x="485" y="220" font-size="34" fill="#3b587c" text-anchor="middle" font-weight="600">h1</text><g class="diagram-node"><rect x="160" y="405" width="290" height="90" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="305.0" y="462.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">not</text></g><path d="M305,390 L305,355" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#rnn-arrow)"/><g class="diagram-node"><rect x="535" y="145" width="290" height="195" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="680.0" y="200.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Update cell</text><text x="680.0" y="274.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Earlier state +</text><text x="680.0" y="316.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">this token</text></g><path d="M465,242 L520,242" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#rnn-arrow)"/><text x="860" y="220" font-size="34" fill="#3b587c" text-anchor="middle" font-weight="600">h2</text><g class="diagram-node"><rect x="535" y="405" width="290" height="90" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="680.0" y="462.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">very</text></g><path d="M680,390 L680,355" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#rnn-arrow)"/><g class="diagram-node"><rect x="910" y="145" width="290" height="195" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1055.0" y="200.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Update cell</text><text x="1055.0" y="274.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Earlier state +</text><text x="1055.0" y="316.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">this token</text></g><path d="M840,242 L895,242" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#rnn-arrow)"/><g class="diagram-node"><rect x="910" y="405" width="290" height="90" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1055.0" y="462.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">helpful</text></g><path d="M1055,390 L1055,355" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#rnn-arrow)"/><path d="M1210,242 L1280,242" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#rnn-arrow)"/><text x="1250" y="220" font-size="34" fill="#3b587c" text-anchor="middle" font-weight="600">h₃</text><g class="diagram-node"><rect x="1300" y="145" width="250" height="195" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="1425.0" y="200.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Classify</text><text x="1425.0" y="274.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Use the final</text><text x="1425.0" y="316.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">state</text></g><text x="800" y="535" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">h is a numerical memory of what the model has read so far.</text></svg>