<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="tfidf-title tfidf-desc">
<title id="tfidf-title">tfidf</title><desc id="tfidf-desc">In six invented training documents the word the appears in all six and refund in two. IDF lowers the influence of ubiquitous words; rarity alone does not prove relevance.</desc>
<defs><marker id="tfidf-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
