l="#f9f7f2"/><text x="1072" y="340" font-size="28" fill="#3b587c" text-anchor="middle" font-weight="400">—</text><rect x="1175" y="85" width="145" height="310" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1247" y="130" font-size="27" fill="#26364a" text-anchor="middle" font-weight="600">Doc 5</text><circle cx="1247" cy="215" r="21" fill="#326657"/><text x="1247" y="225" font-size="28" fill="white" text-anchor="middle" font-weight="400">✓</text><circle cx="1247" cy="330" r="21" fill="#f9f7f2"/><text x="1247" y="340" font-size="28" fill="#3b587c" text-anchor="middle" font-weight="400">—</text><rect x="1350" y="85" width="145" height="310" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1422" y="130" font-size="27" fill="#26364a" text-anchor="middle" font-weight="600">Doc 6</text><circle cx="1422" cy="215" r="21" fill="#326657"/><text x="1422" y="225" font-size="28" fill="white" text-anchor="middle" font-weight="400">✓</text><circle cx="1422" cy="330" r="21" fill="#f9f7f2"/><text x="1422" y="340" font-size="28" fill="#3b587c" text-anchor="middle" font-weight="400">—</text><text x="65" y="225" font-size="40" fill="#26364a" text-anchor="start" font-weight="600">“the”</text><text x="65" y="340" font-size="40" fill="#26364a" text-anchor="start" font-weight="600">“refund”</text><text x="800" y="455" font-size="30" fill="#26364a" text-anchor="middle" font-weight="400">Present in 6 of 6 → less distinctive      Present in 2 of 6 → more distinctive</text><text x="800" y="515" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">TF counts within one document; IDF uses document frequency across training data.</text></svg>