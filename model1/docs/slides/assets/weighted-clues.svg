" y1="130" x2="1515" y2="130" stroke="#d8ddd9" stroke-width="2" stroke-dasharray=""/><text x="910" y="139" font-size="27" fill="#26364a" text-anchor="end" font-weight="400">1</text><polyline points="960.0,419.3 965.1,419.2 970.2,419.1 975.3,419.0 980.4,418.8 985.5,418.7 990.6,418.5 995.7,418.3 1000.8,418.1 1005.9,417.9 1011.0,417.6 1016.1,417.3 1021.2,417.0 1026.3,416.6 1031.4,416.2 1036.5,415.7 1041.6,415.2 1046.7,414.6 1051.8,413.9 1056.9,413.1 1062.0,412.3 1067.1,411.3 1072.2,410.3 1077.3,409.1 1082.4,407.7 1087.5,406.2 1092.6,404.6 1097.7,402.7 1102.8,400.7 1107.9,398.4 1113.0,395.9 1118.1,393.1 1123.2,390.0 1128.3,386.6 1133.4,382.9 1138.5,378.9 1143.6,374.4 1148.7,369.6 1153.8,364.5 1158.9,358.9 1164.0,352.9 1169.1,346.5 1174.2,339.7 1179.3,332.6 1184.4,325.1 1189.5,317.2 1194.6,309.1 1199.7,300.8 1204.8,292.3 1209.9,283.7 1215.0,275.0 1220.1,266.3 1225.2,257.7 1230.3,249.2 1235.4,240.9 1240.5,232.8 1245.6,224.9 1250.7,217.4 1255.8,210.3 1260.9,203.5 1266.0,197.1 1271.1,191.1 1276.2,185.5 1281.3,180.4 1286.4,175.6 1291.5,171.1 1296.6,167.1 1301.7,163.4 1306.8,160.0 1311.9,156.9 1317.0,154.1 1322.1,151.6 1327.2,149.3 1332.3,147.3 1337.4,145.4 1342.5,143.8 1347.6,142.3 1352.7,140.9 1357.8,139.7 1362.9,138.7 1368.0,137.7 1373.1,136.9 1378.2,136.1 1383.3,135.4 1388.4,134.8 1393.5,134.3 1398.6,133.8 1403.7,133.4 1408.8,133.0 1413.9,132.7 1419.0,132.4 1424.1,132.1 1429.2,131.9 1434.3,131.7 1439.4,131.5 1444.5,131.3 1449.6,131.2 1454.7,131.0 1459.8,130.9 1464.9,130.8 1470.0,130.7" fill="none" stroke="#326657" stroke-width="5"/><circle cx="1342.5" cy="143.75350322149433" r="9" fill="#3b587c"/><line x1="1342.5" y1="143.75350322149433" x2="1342.5" y2="420" stroke="#3b587c" stroke-width="2" stroke-dasharray="6 6"/><text x="1342.5" y="459" font-size="28" fill="#3b587c" text-anchor="middle" font-weight="400">score 3</text><text x="1200" y="515" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">Probability ≈ 0.95 in this example</text></svg>