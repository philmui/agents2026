<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="weighted-clues-title weighted-clues-desc">
<title id="weighted-clues-title">weighted clues</title><desc id="weighted-clues-desc">Invented logistic regression calculation: frozen contributes 2, screen contributes 2, fee contributes zero, bias contributes minus 1. Score 3 maps to about 0.95 through the sigmoid curve; it is not a measured confidence.</desc>
<defs><marker id="weighted-clues-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
