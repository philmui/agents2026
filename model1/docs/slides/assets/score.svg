<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="score-title score-desc">
<title id="score-title">score</title><desc id="score-desc">An invented Score distribution of 0.1, 0.3, 0.6 over levels 0, 1, 2 gives score 1.5.</desc>
<defs><marker id="score-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="70" y="65" width="465" height="240" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="302.5" y="164.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Level 0: 10%</text><text x="302.5" y="238.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Cosmetic issue</text></g><g class="diagram-node"><rect x="575" y="65" width="465" height="240" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="807.5" y="164.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Level 1: 30%</text><text x="807.5" y="238.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Workaround exists</text></g><g class="diagram-node"><rect x="1080" y="65" width="465" height="240" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="1312.5" y="164.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Level 2: 60%</text><text x="1312.5" y="238.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Blocked; no workaround</text></g><text x="800" y="395" font-size="40" fill="#3b587c" text-anchor="middle" font-weight="600">Score = 0 × 0.1 + 1 × 0.3 + 2 × 0.6 = 1.5</text><text x="800" y="475" font-size="31" fill="#26364a" text-anchor="middle" font-weight="400">A position on your rubric, not a physical measurement of damage.</text></svg>