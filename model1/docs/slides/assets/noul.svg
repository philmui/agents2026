<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="noul-title noul-desc">
<title id="noul-title">noul</title><desc id="noul-desc">Noul is a probability that one yes/no statement is true: 0.1 favors no, 0.5 is uncertain, 0.9 favors yes. It is not a second confidence metric.</desc>
<defs><marker id="noul-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="800" y="50" font-size="34" fill="#3b587c" text-anchor="middle" font-weight="600">QUESTION: “Does the message describe a blocked device?”</text><line x1="150" y1="270" x2="1450" y2="270" stroke="#26364a" stroke-width="4" stroke-dasharray=""/><text x="150" y="335" font-size="32" fill="#26364a" text-anchor="middle" font-weight="400">0 · no</text><text x="1450" y="335" font-size="32" fill="#26364a" text-anchor="middle" font-weight="400">1 · yes</text><circle cx="280.0" cy="270" r="13" fill="#3b587c"/><g class="diagram-node"><rect x="120.0" y="100" width="320" height="110" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="280.0" y="167.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">0.1</text></g><line x1="280.0" y1="215" x2="280.0" y2="253" stroke="#3b587c" stroke-width="2" stroke-dasharray=""/><text x="280.0" y="420" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">No is favored</text><circle cx="800.0" cy="270" r="13" fill="#3b587c"/><g class="diagram-node"><rect x="640.0" y="100" width="320" height="110" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="800.0" y="167.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">0.5</text></g><line x1="800.0" y1="215" x2="800.0" y2="253" stroke="#3b587c" stroke-width="2" stroke-dasharray=""/><text x="800.0" y="420" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Uncertain</text><circle cx="1320.0" cy="270" r="13" fill="#3b587c"/><g class="diagram-node"><rect x="1160.0" y="100" width="320" height="110" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1320.0" y="167.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">0.9</text></g><line x1="1320.0" y1="215" x2="1320.0" y2="253" stroke="#3b587c" stroke-width="2" stroke-dasharray=""/><text x="1320.0" y="420" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Yes is favored</text><text x="800" y="515" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">For this question, P(no) = 1 − P(yes). Separate questions need not sum to 1.</text></svg>