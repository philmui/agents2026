<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="context-bank-title context-bank-desc">
<title id="context-bank-title">context bank</title><desc id="context-bank-desc">A static word embedding gives bank one vector; contextual models can represent its two uses differently.</desc>
<defs><marker id="context-bank-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="75" y="70" width="690" height="170" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="420.0" y="134.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">We sat by the river bank.</text><text x="420.0" y="208.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Nearby words suggest a river edge.</text></g><g class="diagram-node"><rect x="835" y="70" width="690" height="170" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1180.0" y="134.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">We opened a bank account.</text><text x="1180.0" y="208.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Nearby words suggest a financial institution.</text></g><text x="800" y="370" font-size="40" fill="#8b5137" text-anchor="middle" font-weight="400">Static lookup: one bank vector</text><text x="800" y="450" font-size="35" fill="#3b587c" text-anchor="middle" font-weight="400">Contextual model: a representation shaped by the sentence</text></svg>