<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="data-splits-title data-splits-desc">
<title id="data-splits-title">data splits</title><desc id="data-splits-desc">Training set → Development set → Test set</desc>
<defs><marker id="data-splits-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="70.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 01</text><g class="diagram-node"><rect x="70.0" y="115" width="440.0" height="280" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="290.0" y="213.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Training set</text><text x="290.0" y="287.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Learn the model and</text><text x="290.0" y="329.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">vocabulary</text></g><path d="M518.0,250 L568.0,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#data-splits-arrow)"/><text x="580.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 02</text><g class="diagram-node"><rect x="580.0" y="115" width="440.0" height="280" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="800.0" y="213.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Development set</text><text x="800.0" y="287.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Choose settings and</text><text x="800.0" y="329.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">thresholds</text></g><path d="M1028.0,250 L1078.0,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#data-splits-arrow)"/><text x="1090.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 03</text><g class="diagram-node"><rect x="1090.0" y="115" width="440.0" height="280" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="1310.0" y="213.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Test set</text><text x="1310.0" y="287.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Evaluate once after choices</text><text x="1310.0" y="329.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">are fixed</text></g></svg>