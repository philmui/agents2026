<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="confidence-title confidence-desc">
<title id="confidence-title">confidence</title><desc id="confidence-desc">Choice confidence rescales the top probability relative to an even split. For 3 options the baseline is one-third; probability 0.80 maps to confidence 0.70. Confidence is not a measured correctness rate.</desc>
<defs><marker id="confidence-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="800" y="45" font-size="28" fill="#3b587c" text-anchor="middle" font-weight="600">SAME ANSWER, TWO DIFFERENT NUMBERS</text><g class="diagram-node"><rect x="65" y="85" width="640" height="190" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="385.0" y="159.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Top probability: 0.80</text><text x="385.0" y="233.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Estimated probability of the selected option</text></g><g class="diagram-node"><rect x="895" y="85" width="640" height="190" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1215.0" y="138.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Choice confidence: 0.70</text><text x="1215.0" y="212.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Distance above an even split, rescaled to</text><text x="1215.0" y="254.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">0–1</text></g><path d="M730,180 L865,180" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#confidence-arrow)"/><line x1="120" y1="385" x2="1480" y2="385" stroke="#26364a" stroke-width="4" stroke-dasharray=""/><circle cx="573.3333333333333" cy="385" r="10" fill="#3b587c"/><text x="573.3333333333333" y="345" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">⅓: even split</text><circle cx="1208.0" cy="385" r="10" fill="#3b587c"/><text x="1208.0" y="345" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">0.80: this answer</text><circle cx="1480" cy="385" r="10" fill="#3b587c"/><text x="1480" y="345" font-size="28" fill="#26364a" text-anchor="end" font-weight="400">1.00</text><text x="800" y="455" font-size="40" fill="#3b587c" text-anchor="middle" font-weight="600">confidence = (0.80 − ⅓) / (1 − ⅓) = 0.70</text><text x="800" y="525" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">Compare with observed outcomes before trusting the number as a routing signal.</text></svg>