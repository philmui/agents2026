<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="structured-state-title structured-state-desc">
<title id="structured-state-title">structured state</title><desc id="structured-state-desc">Structured state contains the message and relevant verified facts. An example JSON object holds message, policy, and facts; a separate question asks which team should help. JSON structure does not verify truth.</desc>
<defs><marker id="structured-state-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<rect x="55" y="50" width="925" height="455" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="85" y="100" font-size="27" fill="#3b587c" text-anchor="start" font-weight="600">STATE · RELEVANT EVIDENCE</text><text x="85" y="175" font-size="30" fill="#26364a" text-anchor="start" font-weight="400">{</text><text x="85" y="237" font-size="30" fill="#26364a" text-anchor="start" font-weight="400">  &quot;message&quot;: &quot;The device will not start.&quot;,</text><text x="85" y="299" font-size="30" fill="#26364a" text-anchor="start" font-weight="400">  &quot;policy&quot;: &quot;Blocked devices → technical&quot;,</text><text x="85" y="361" font-size="30" fill="#26364a" text-anchor="start" font-weight="400">  &quot;facts&quot;: {&quot;loan_device_available&quot;: true}</text><text x="85" y="423" font-size="30" fill="#26364a" text-anchor="start" font-weight="400">}</text><path d="M1005,280 L1095,280" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#structured-state-arrow)"/><g class="diagram-node"><rect x="1120" y="130" width="430" height="310" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1335.0" y="243.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">QUESTION</text><text x="1335.0" y="317.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Which team should handle</text><text x="1335.0" y="359.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">this request?</text></g></svg>