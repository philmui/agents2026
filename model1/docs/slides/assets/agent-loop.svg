<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="agent-loop-title agent-loop-desc">
<title id="agent-loop-title">agent loop</title><desc id="agent-loop-desc">Plan a step, choose an allowed action, run a tool, read its result, then feed the result into the next step. The loop ends when completion or a budget limit is reached. Jev can provide bounded choices while code controls the workflow.</desc>
<defs><marker id="agent-loop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="60" y="100" width="330" height="235" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="225.0" y="196.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Plan a step</text><text x="225.0" y="270.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">A generator can plan</text></g><path d="M403,217 L435,217" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#agent-loop-arrow)"/><g class="diagram-node"><rect x="450" y="100" width="330" height="235" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="615.0" y="175.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Choose an action</text><text x="615.0" y="249.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Jev can judge a</text><text x="615.0" y="291.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">bounded choice</text></g><path d="M793,217 L825,217" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#agent-loop-arrow)"/><g class="diagram-node"><rect x="840" y="100" width="330" height="235" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="1005.0" y="175.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Run a tool</text><text x="1005.0" y="249.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Code checks</text><text x="1005.0" y="291.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">permissions</text></g><path d="M1183,217 L1215,217" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#agent-loop-arrow)"/><g class="diagram-node"><rect x="1230" y="100" width="330" height="235" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1395.0" y="175.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Read the result</text><text x="1395.0" y="249.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Update the shared</text><text x="1395.0" y="291.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">state</text></g><path d="M1395,355 L1395,445 L225,445 L225,355" fill="none" stroke="#326657" stroke-width="4" marker-end="url(#agent-loop-arrow)"/><rect x="555" y="416" width="530" height="57" rx="12" fill="#faf8f3" stroke="none" stroke-width="2"/><text x="820" y="455" font-size="29" fill="#326657" text-anchor="middle" font-weight="600">Continue with the new evidence</text><text x="800" y="535" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">Stop when the task is complete or the workflow reaches a budget limit.</text></svg>