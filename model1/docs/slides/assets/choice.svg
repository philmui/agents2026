<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="choice-title choice-desc">
<title id="choice-title">choice</title><desc id="choice-desc">Invented Choice distribution for a laptop message: technical 80 percent, billing 15 percent, information 5 percent. The values sum to 100 percent, and Choice selects technical. These values are not a Jev measurement.</desc>
<defs><marker id="choice-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
