<title id="cnn-title">cnn</title><desc id="cnn-desc">A three-token filter slides over four windows of the same six-token sentence. Invented response scores are 0.1, 0.2, 0.9, 0.8. Outlines show each exact window; the same filter weights are used at every position.</desc>
