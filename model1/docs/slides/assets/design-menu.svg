<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="design-menu-title design-menu-desc">
<title id="design-menu-title">design menu</title><desc id="design-menu-desc">Four approaches compared by output and task setup: count classifiers need labels; encoders need task adaptation; generators can follow instructions; Jev uses described choices and must be evaluated on the application.</desc>
<defs><marker id="design-menu-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="80" y="50" font-size="27" fill="#3b587c" text-anchor="start" font-weight="600">APPROACH</text><text x="635" y="50" font-size="27" fill="#3b587c" text-anchor="start" font-weight="600">USEFUL OUTPUT</text><text x="1090" y="50" font-size="27" fill="#3b587c" text-anchor="start" font-weight="600">TASK SETUP</text><rect x="50" y="85" width="1500" height="95" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="80" y="123.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Word-count classifier</text><text x="635" y="123.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">One fixed label set</text><text x="1090" y="123.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Train on labeled examples</text><rect x="50" y="197" width="1500" height="95" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="80" y="235.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Fine-tuned encoder</text><text x="635" y="235.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Contextual classification</text><text x="1090" y="235.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Adapt to your label set</text><rect x="50" y="309" width="1500" height="95" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="80" y="347.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Generative model</text><text x="635" y="347.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Labels and open text</text><text x="1090" y="347.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Prompt; sometimes fine-tune</text><rect x="50" y="421" width="1500" height="95" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="80" y="459.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Jev decision API</text><text x="635" y="459.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Typed bounded decisions</text><text x="1090" y="459.0" font-size="28" fill="#26364a" text-anchor="start" font-weight="400">Describe; test on your task</text></svg>