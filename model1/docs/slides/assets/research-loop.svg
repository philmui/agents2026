<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="research-loop-title research-loop-desc">
<title id="research-loop-title">research loop</title><desc id="research-loop-desc">Ask a testable question → Keep a held-out test set → Compare alternatives → Inspect the failures</desc>
<defs><marker id="research-loop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="70.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 01</text><g class="diagram-node"><rect x="70.0" y="115" width="312.5" height="280" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="226.25" y="209.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Ask a testable</text><text x="226.25" y="259.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">question</text><text x="226.25" y="333.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">What could improve?</text></g><path d="M390.5,250 L440.5,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#research-loop-arrow)"/><text x="452.5" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 02</text><g class="diagram-node"><rect x="452.5" y="115" width="312.5" height="280" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="608.75" y="188.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Keep a held-out</text><text x="608.75" y="238.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">test set</text><text x="608.75" y="312.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Prevent tuning on</text><text x="608.75" y="354.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">the answer key</text></g><path d="M773.0,250 L823.0,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#research-loop-arrow)"/><text x="835.0" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 03</text><g class="diagram-node"><rect x="835.0" y="115" width="312.5" height="280" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="991.25" y="188.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Compare</text><text x="991.25" y="238.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">alternatives</text><text x="991.25" y="312.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Measure quality,</text><text x="991.25" y="354.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">latency, cost</text></g><path d="M1155.5,250 L1205.5,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#research-loop-arrow)"/><text x="1217.5" y="85" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STEP 04</text><g class="diagram-node"><rect x="1217.5" y="115" width="312.5" height="280" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1373.75" y="188.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Inspect the</text><text x="1373.75" y="238.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">failures</text><text x="1373.75" y="312.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Learn where the idea</text><text x="1373.75" y="354.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">breaks</text></g></svg>