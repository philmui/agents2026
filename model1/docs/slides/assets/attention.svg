<title id="attention-title">attention</title><desc id="attention-desc">For the token bank, invented attention weights are The 0.05, river 0.45, bank 0.10, was 0.05, muddy 0.35, summing to 1. This illustrates learned mixing rather than measured attention or a proof of reasoning.</desc>
