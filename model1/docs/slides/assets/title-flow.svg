<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 280" role="img" aria-labelledby="title-flow-title title-flow-desc">
<title id="title-flow-title">title flow</title><desc id="title-flow-desc">A laptop message becomes numerical features and then the category technical help.</desc>
<defs><marker id="title-flow-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="30" y="25" width="530" height="230" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="295.0" y="119.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">My laptop will not start.</text><text x="295.0" y="193.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Start with a message</text></g><path d="M580,140 L685,140" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#title-flow-arrow)"/><g class="diagram-node"><rect x="710" y="25" width="365" height="230" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="892.5" y="119.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Words → numbers</text><text x="892.5" y="193.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Make it computable</text></g><path d="M1095,140 L1200,140" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#title-flow-arrow)"/><g class="diagram-node"><rect x="1225" y="25" width="345" height="230" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="1397.5" y="119.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Technical help</text><text x="1397.5" y="193.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Choose a destination</text></g></svg>