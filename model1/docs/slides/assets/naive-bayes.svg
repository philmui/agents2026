<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="naive-bayes-title naive-bayes-desc">
<title id="naive-bayes-title">naive bayes</title><desc id="naive-bayes-desc">Invented numbers for screen frozen: technical score 0.6 times 0.2 times 0.15 equals 0.018; billing score 0.4 times 0.02 times 0.01 equals 0.00008. These are unnormalized scores, not final probabilities.</desc>
<defs><marker id="naive-bayes-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="65" y="55" font-size="36" fill="#3b587c" text-anchor="start" font-weight="600">MESSAGE: “screen frozen”</text><text x="65" y="140" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">CLASS</text><text x="360" y="140" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">STARTING SHARE</text><text x="750" y="140" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">WORD CLUES</text><text x="1295" y="140" font-size="26" fill="#3b587c" text-anchor="start" font-weight="600">RESULT</text><rect x="45" y="175" width="1510" height="110" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="65" y="241" font-size="36" fill="#26364a" text-anchor="start" font-weight="600">technical</text><text x="390" y="241" font-size="36" fill="#26364a" text-anchor="start" font-weight="600">0.60</text><text x="750" y="241" font-size="36" fill="#26364a" text-anchor="start" font-weight="600">0.20 × 0.15</text><text x="1295" y="241" font-size="36" fill="#26364a" text-anchor="start" font-weight="600">0.018</text><text x="655" y="241" font-size="36" fill="#26364a" text-anchor="start" font-weight="400">×</text><text x="1180" y="241" font-size="36" fill="#26364a" text-anchor="start" font-weight="400">=</text><rect x="45" y="310" width="1510" height="110" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="65" y="376" font-size="36" fill="#26364a" text-anchor="start" font-weight="600">billing</text><text x="390" y="376" font-size="36" fill="#26364a" text-anchor="start" font-weight="600">0.40</text><text x="750" y="376" font-size="36" fill="#26364a" text-anchor="start" font-weight="600">0.02 × 0.01</text><text x="1295" y="376" font-size="36" fill="#26364a" text-anchor="start" font-weight="600">0.00008</text><text x="655" y="376" font-size="36" fill="#26364a" text-anchor="start" font-weight="400">×</text><text x="1180" y="376" font-size="36" fill="#26364a" text-anchor="start" font-weight="400">=</text><text x="800" y="500" font-size="30" fill="#26364a" text-anchor="middle" font-weight="400">Technical has the larger score. Normalize the scores if you need probabilities.</text></svg>