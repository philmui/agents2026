<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="lstm-title lstm-desc">
<title id="lstm-title">lstm</title><desc id="lstm-desc">Learned gates control what information is kept and what new information is added.</desc>
<defs><marker id="lstm-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<path d="M80,245 L300,245" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#lstm-arrow)"/><text x="85" y="205" font-size="30" fill="#26364a" text-anchor="start" font-weight="400">Earlier state</text><g class="diagram-node"><rect x="330" y="110" width="420" height="285" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="540.0" y="210.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Keep / forget gate</text><text x="540.0" y="284.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Which earlier information</text><text x="540.0" y="326.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">stays?</text></g><path d="M775,245 L870,245" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#lstm-arrow)"/><g class="diagram-node"><rect x="900" y="110" width="420" height="285" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="1110.0" y="210.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Add new information</text><text x="1110.0" y="284.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">What should this word</text><text x="1110.0" y="326.5" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">contribute?</text></g><path d="M1340,245 L1510,245" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#lstm-arrow)"/><text x="800" y="480" font-size="30" fill="#26364a" text-anchor="middle" font-weight="400">Gates are learned numerical operations, not hand-written language rules.</text></svg>