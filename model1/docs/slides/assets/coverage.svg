<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="coverage-title coverage-desc">
<title id="coverage-title">coverage</title><desc id="coverage-desc">Invented coverage at thresholds 0.2, 0.5, 0.8 is 8, 6, 3 automatic cases out of 10. Remaining cases go to review. Letter A marks automatic; R marks review so color is not the only cue.</desc>
