<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="multi-agent-title multi-agent-desc">
<title id="multi-agent-title">multi agent</title><desc id="multi-agent-desc">A coordinator routes tasks to search, coding, and explanation specialists. Their returned evidence joins at a review step before the workflow accepts results. This is a research proposal.</desc>
