<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="embeddings-title embeddings-desc">
<title id="embeddings-title">embeddings</title><desc id="embeddings-desc">An embedding is a learned list of numbers; a two-dimensional drawing is a simplified view.</desc>
<defs><marker id="embeddings-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<line x1="130" y1="420" x2="650" y2="420" stroke="#26364a" stroke-width="3" stroke-dasharray=""/><line x1="130" y1="420" x2="130" y2="70" stroke="#26364a" stroke-width="3" stroke-dasharray=""/><circle cx="300" cy="160" r="11" fill="#3b587c"/><text x="318" y="169" font-size="29" fill="#3b587c" text-anchor="start" font-weight="400">screen</text><circle cx="380" cy="200" r="11" fill="#3b587c"/><text x="398" y="209" font-size="29" fill="#3b587c" text-anchor="start" font-weight="400">display</text><circle cx="510" cy="325" r="11" fill="#8b5137"/><text x="528" y="334" font-size="29" fill="#8b5137" text-anchor="start" font-weight="400">refund</text><circle cx="550" cy="280" r="11" fill="#8b5137"/><text x="568" y="289" font-size="29" fill="#8b5137" text-anchor="start" font-weight="400">payment</text><g class="diagram-node"><rect x="860" y="90" width="650" height="270" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1185.0" y="183.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">screen → [0.2, −0.7, 0.5, …]</text><text x="1185.0" y="257.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">Values are learned; axes are usually not</text><text x="1185.0" y="299.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">named concepts.</text></g><text x="800" y="495" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">This invented map illustrates similarity; it is not a measured embedding plot.</text></svg>