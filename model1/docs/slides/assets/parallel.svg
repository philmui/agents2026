<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="parallel-title parallel-desc">
<title id="parallel-title">parallel</title><desc id="parallel-desc">The same state feeds separate Choice, Noul, and Score questions. The application receives all three answers and combines them in code. The questions need not be statistically independent.</desc>
<defs><marker id="parallel-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="65" y="165" width="390" height="180" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="260.0" y="267.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">One shared state</text></g><path d="M475,250 L600,85" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#parallel-arrow)"/><g class="diagram-node"><rect x="625" y="20" width="410" height="135" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="830.0" y="99.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Choice: topic</text></g><line x1="1055" y1="85" x2="1175" y2="85" stroke="#26364a" stroke-width="3" stroke-dasharray=""/><path d="M475,250 L600,260" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#parallel-arrow)"/><g class="diagram-node"><rect x="625" y="195" width="410" height="135" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="830.0" y="274.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Noul: urgent?</text></g><line x1="1055" y1="260" x2="1175" y2="260" stroke="#26364a" stroke-width="3" stroke-dasharray=""/><path d="M475,250 L600,435" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#parallel-arrow)"/><g class="diagram-node"><rect x="625" y="370" width="410" height="135" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="830.0" y="449.5" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Score: severity</text></g><line x1="1055" y1="435" x2="1175" y2="435" stroke="#26364a" stroke-width="3" stroke-dasharray=""/><line x1="1175" y1="85" x2="1175" y2="435" stroke="#26364a" stroke-width="3" stroke-dasharray=""/><path d="M1175,250 L1220,250" fill="none" stroke="#26364a" stroke-width="4" marker-end="url(#parallel-arrow)"/><g class="diagram-node"><rect x="1240" y="165" width="290" height="180" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="1385.0" y="242.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">Code combines</text><text x="1385.0" y="292.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">answers</text></g></svg>