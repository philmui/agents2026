<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="bigrams-title bigrams-desc">
<title id="bigrams-title">bigrams</title><desc id="bigrams-desc">Neighboring pairs preserve a little word order, but require more features.</desc>
<defs><marker id="bigrams-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<g class="diagram-node"><rect x="80" y="130" width="465" height="220" rx="12" fill="#e6edf8" stroke="none" stroke-width="2"/><text x="312.5" y="219.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">student helps</text><text x="312.5" y="293.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">A two-word feature</text></g><g class="diagram-node"><rect x="585" y="130" width="465" height="220" rx="12" fill="#e0eee6" stroke="none" stroke-width="2"/><text x="817.5" y="219.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">helps the</text><text x="817.5" y="293.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">A two-word feature</text></g><g class="diagram-node"><rect x="1090" y="130" width="465" height="220" rx="12" fill="#f6e4da" stroke="none" stroke-width="2"/><text x="1322.5" y="219.0" font-size="33" fill="#26364a" text-anchor="middle" font-weight="600">the teacher</text><text x="1322.5" y="293.0" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">A two-word feature</text></g><text x="800" y="445" font-size="30" fill="#26364a" text-anchor="middle" font-weight="400">Pairs preserve local order; they still do not capture every long-distance relationship.</text></svg>