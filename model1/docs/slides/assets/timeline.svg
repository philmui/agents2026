<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="timeline-title timeline-desc">
<title id="timeline-title">timeline</title><desc id="timeline-desc">Selected milestones, with equal spacing rather than a time scale. Word counts; embeddings and CNNs in 2013–14; Transformer in 2017; BERT and T5 in 2018–19; ModernBERT in 2024; Jev in 2026.</desc>
<defs><marker id="timeline-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Source Sans 3',sans-serif} .mono{font-family:monospace}</style>
<text x="65" y="45" font-size="27" fill="#3b587c" text-anchor="start" font-weight="600">SELECTED MILESTONES · SPACING IS NOT A TIME SCALE</text><line x1="155" y1="270" x2="1455" y2="270" stroke="#3b587c" stroke-width="4" stroke-dasharray=""/><circle cx="155" cy="270" r="13" fill="#3b587c"/><text x="155" y="205" font-size="35" fill="#3b587c" text-anchor="middle" font-weight="600">Earlier</text><text x="155" y="330.0" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">Word counts</text><circle cx="415" cy="270" r="13" fill="#3b587c"/><text x="415" y="205" font-size="35" fill="#3b587c" text-anchor="middle" font-weight="600">2013–14</text><text x="415" y="330.0" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">Embeddings + CNNs</text><circle cx="675" cy="270" r="13" fill="#3b587c"/><text x="675" y="205" font-size="35" fill="#3b587c" text-anchor="middle" font-weight="600">2017</text><text x="675" y="330.0" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">Transformer</text><circle cx="935" cy="270" r="13" fill="#3b587c"/><text x="935" y="205" font-size="35" fill="#3b587c" text-anchor="middle" font-weight="600">2018–19</text><text x="935" y="330.0" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">BERT + T5</text><circle cx="1195" cy="270" r="13" fill="#3b587c"/><text x="1195" y="205" font-size="35" fill="#3b587c" text-anchor="middle" font-weight="600">2024</text><text x="1195" y="330.0" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">ModernBERT</text><circle cx="1455" cy="270" r="13" fill="#3b587c"/><text x="1455" y="205" font-size="35" fill="#3b587c" text-anchor="middle" font-weight="600">2026</text><text x="1455" y="330.0" font-size="29" fill="#26364a" text-anchor="middle" font-weight="400">Jev</text><text x="800" y="480" font-size="28" fill="#26364a" text-anchor="middle" font-weight="400">RNNs began earlier; ULMFiT demonstrated language-model transfer for classification in 2018.</text></svg>