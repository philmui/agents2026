[project]
name = "beam"
version = "0.1.0"
description = "A conversational Beam and LangGraph agent with interactive provider evaluation"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "openai>=2.0,<3",
  "python-dotenv>=1.1,<2",
  "httpx>=0.28,<1",
  "ipywidgets>=8.1,<9",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "jupyterlab>=4.3,<5",
  "ipykernel>=6.29,<8",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test_beam_agent.py"]
