<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>.title{font-size:26px;font-weight:700;fill:#0f172a;}.lbl{font-size:18px;font-weight:700;fill:#0f172a;}.sub{font-size:14px;fill:#64748b;}.cap{font-size:13.5px;fill:#334155;}.mono{font-size:15px;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;fill:#0f172a;}</style>
  </defs>
  <title id="title">One harness, three stages, three questions</title>
  <desc id="desc">The same harness answers a different question at MVP, PoC, and production. The transition that matters is MVP to PoC, where you start reporting a number against data you did not choose.</desc>
  <text x="34" y="40" class="title">The same harness means three different things</text>
  <text x="34" y="68" class="sub">What changes across stages is not the code. It is the data you run it against and the question you are answering.</text>

  <!-- MVP -->
  <rect x="34" y="102" width="250" height="196" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="58" y="140" class="lbl">MVP</text>
  <text x="58" y="172" class="cap" font-weight="700">Does it work at all?</text>
  <text x="58" y="202" class="cap">against: your goldens</text>
  <text x="58" y="228" class="cap">measure: pass rate, eyeballs</text>
  <text x="58" y="264" class="cap">Audience: your own team.</text>

  <line x1="286" y1="200" x2="326" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- PoC (highlighted) -->
  <rect x="328" y="88" width="250" height="224" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="352" y="126" class="lbl">PoC</text>
  <text x="352" y="158" class="cap" font-weight="700">Work well enough to fund?</text>
  <text x="352" y="188" class="cap">against: back-tested history</text>
  <text x="352" y="212" class="cap">measure: calibrated judge,</text>
  <text x="352" y="232" class="cap">intervals on every number</text>
  <text x="352" y="268" class="cap" font-weight="700">The transition that matters.</text>
  <text x="352" y="292" class="cap">Data you did NOT choose.</text>

  <line x1="580" y1="200" x2="620" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Production -->
  <rect x="622" y="102" width="244" height="196" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="646" y="140" class="lbl">Production</text>
  <text x="646" y="172" class="cap" font-weight="700">Is it still working?</text>
  <text x="646" y="202" class="cap">against: live traffic, sampled</text>
  <text x="646" y="228" class="cap">measure: scored continuously,</text>
  <text x="646" y="252" class="cap">per-slice, with trend lines</text>

  <text x="450" y="352" text-anchor="middle" class="cap" font-weight="700">MVP to PoC is not a technical step. It is when you stop saying "it looks good."</text>
  <text x="450" y="390" text-anchor="middle" class="sub">If you take one thing away: the number has to come from data you did not pick, and it has to come with an interval.</text>
</svg>
