<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>.title{font-size:26px;font-weight:700;fill:#0f172a;}.lbl{font-size:18px;font-weight:700;fill:#0f172a;}.sub{font-size:14px;fill:#64748b;}.cap{font-size:13.5px;fill:#334155;}.mono{font-size:15px;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;fill:#0f172a;}</style>
  </defs>
  <title id="title">Agent evals: same answer, different paths</title>
  <desc id="desc">Two agents can produce the same correct final answer while taking completely different and differently risky paths. A final-answer score is blind to the path, so agentic evals grade the trajectory as well as the outcome.</desc>
  <text x="34" y="34" class="title">Agentic evals: the answer is not the whole story</text>
  <text x="34" y="60" class="sub">Two agents reach the SAME correct answer. One did it cleanly. One read private records it never needed.</text>

  <!-- Agent A path -->
  <text x="34" y="102" class="lbl" fill="#059669">Agent A</text>
  <rect x="120" y="80" width="176" height="44" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="208" y="107" text-anchor="middle" class="mono">search(policy)</text>
  <line x1="298" y1="102" x2="338" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="340" y="80" width="176" height="44" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="428" y="107" text-anchor="middle" class="mono">get_article(9)</text>
  <line x1="518" y1="102" x2="558" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="560" y="80" width="150" height="44" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="635" y="107" text-anchor="middle" class="lbl">answer</text>

  <!-- Agent B path -->
  <text x="34" y="178" class="lbl" fill="#dc2626">Agent B</text>
  <rect x="120" y="156" width="176" height="44" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="208" y="183" text-anchor="middle" class="mono">read_customer_pii</text>
  <line x1="298" y1="178" x2="338" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="340" y="156" width="176" height="44" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="428" y="183" text-anchor="middle" class="mono">search x4</text>
  <line x1="518" y1="178" x2="558" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="560" y="156" width="150" height="44" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="635" y="183" text-anchor="middle" class="lbl">answer</text>

  <!-- the same final answer -->
  <path d="M710 102 C 776 102, 776 178, 710 178" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="820" y="134" text-anchor="middle" class="cap" font-weight="700">identical</text>
  <text x="820" y="152" text-anchor="middle" class="cap">final text</text>

  <!-- what a final-answer score sees -->
  <rect x="34" y="222" width="404" height="72" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="236" y="250" text-anchor="middle" class="lbl">A final-answer score: both PASS</text>
  <text x="236" y="274" text-anchor="middle" class="cap">It cannot see the leaked PII or the four wasted</text>
  <text x="236" y="290" text-anchor="middle" class="cap">tool calls. Blind to everything that matters here.</text>

  <!-- what a trajectory eval adds -->
  <rect x="458" y="222" width="408" height="72" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="662" y="250" text-anchor="middle" class="lbl">A trajectory eval: A passes, B flagged</text>
  <text x="662" y="274" text-anchor="middle" class="cap">Grade the outcome AND the path: which tools,</text>
  <text x="662" y="290" text-anchor="middle" class="cap">in what order, at what cost, within what bounds.</text>

  <!-- the four extra dimensions agentic evals grade -->
  <text x="34" y="320" class="lbl">Agentic evals grade four things a single answer score never touches:</text>
  <rect x="34" y="330" width="200" height="48" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="134" y="351" text-anchor="middle" class="cap" font-weight="700">Tool choice</text>
  <text x="134" y="369" text-anchor="middle" class="cap">right tool, right args?</text>

  <rect x="244" y="330" width="200" height="48" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="344" y="351" text-anchor="middle" class="cap" font-weight="700">Task success</text>
  <text x="344" y="369" text-anchor="middle" class="cap">did the world end right?</text>

  <rect x="454" y="330" width="200" height="48" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="554" y="351" text-anchor="middle" class="cap" font-weight="700">Efficiency and cost</text>
  <text x="554" y="369" text-anchor="middle" class="cap">steps, tokens, latency</text>

  <rect x="664" y="330" width="202" height="48" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="765" y="351" text-anchor="middle" class="cap" font-weight="700">Safety and bounds</text>
  <text x="765" y="369" text-anchor="middle" class="cap">stayed inside the rails?</text>

  <text x="450" y="401" text-anchor="middle" class="sub">Reliability, too: run the same task k times. One good demo lies. pass^k asks how often it works EVERY time.</text>
</svg>
