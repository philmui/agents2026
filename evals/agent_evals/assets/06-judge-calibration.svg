<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>.title{font-size:26px;font-weight:700;fill:#0f172a;}.lbl{font-size:19px;font-weight:700;fill:#0f172a;}.sub{font-size:14px;fill:#64748b;}.cap{font-size:14px;fill:#334155;}.mono{font-size:15px;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;fill:#0f172a;}.axis{font-size:13px;fill:#64748b;}</style>
  </defs>
  <title id="title">Separation and agreement are two different questions</title>
  <desc id="desc">A judge can separate known-good from known-bad answers yet still fail to agree with how a human scores. Both must hold before you trust a judge.</desc>
  <text x="34" y="40" class="title">Calibrating a judge: two questions, not one</text>
  <text x="34" y="68" class="sub">"I checked it works on a good answer and a bad answer" tests only the first. The number you report needs both.</text>

  <!-- question 1: separation -->
  <rect x="34" y="92" width="410" height="168" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="58" y="126" class="lbl">1. Separation</text>
  <text x="58" y="150" class="cap">Can it tell known-bad from known-good AT ALL?</text>
  <!-- two clusters -->
  <circle cx="140" cy="196" r="9" fill="#dc2626"/><circle cx="164" cy="212" r="9" fill="#dc2626"/><circle cx="122" cy="218" r="9" fill="#dc2626"/><circle cx="150" cy="230" r="9" fill="#dc2626"/>
  <text x="143" y="254" text-anchor="middle" class="cap">bad, scored low</text>
  <circle cx="336" cy="186" r="9" fill="#059669"/><circle cx="360" cy="202" r="9" fill="#059669"/><circle cx="324" cy="214" r="9" fill="#059669"/><circle cx="352" cy="226" r="9" fill="#059669"/>
  <text x="342" y="250" text-anchor="middle" class="cap">good, scored high</text>
  <text x="240" y="212" text-anchor="middle" class="sub">gap</text>

  <!-- question 2: agreement -->
  <rect x="456" y="92" width="410" height="168" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="480" y="126" class="lbl">2. Agreement</text>
  <text x="480" y="150" class="cap">Does it score the way a HUMAN would?</text>
  <!-- scatter along diagonal -->
  <line x1="512" y1="244" x2="656" y2="166" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="528" cy="238" r="6" fill="#7c3aed"/><circle cx="560" cy="222" r="6" fill="#7c3aed"/><circle cx="592" cy="196" r="6" fill="#7c3aed"/><circle cx="624" cy="182" r="6" fill="#7c3aed"/><circle cx="576" cy="216" r="6" fill="#7c3aed"/>
  <text x="686" y="182" class="cap">correlation,</text>
  <text x="686" y="202" class="cap">within-1-point</text>
  <text x="686" y="228" class="cap" font-weight="700">the harder bar</text>

  <!-- the trap -->
  <rect x="34" y="278" width="832" height="56" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="450" y="302" text-anchor="middle" class="cap" font-weight="700">A judge can PASS separation and FAIL agreement. That is the common case.</text>
  <text x="450" y="322" text-anchor="middle" class="cap">It means the judge sees the difference but scores it on a scale that is not yours.</text>

  <!-- the ceiling caution -->
  <rect x="34" y="344" width="832" height="58" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="450" y="368" text-anchor="middle" class="lbl">You cannot hold a judge to a standard humans do not meet</text>
  <text x="450" y="390" text-anchor="middle" class="cap">If experts agree with each other only a third of the time, a judge that agrees with you a third of the time is already at human level.</text>
</svg>
