<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>.title{font-size:26px;font-weight:700;fill:#0f172a;}.lbl{font-size:18px;font-weight:700;fill:#0f172a;}.sub{font-size:14px;fill:#64748b;}.cap{font-size:13.5px;fill:#334155;}.mono{font-size:15px;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;fill:#0f172a;}</style>
  </defs>
  <title id="title">Make the failures your data barely contains</title>
  <desc id="desc">Real data is mostly the happy path, so a random sample of twenty contains about one bad example. Corrupting a known-good summary in a named way produces a labeled failure for free.</desc>
  <text x="34" y="40" class="title">Generate the failures you need</text>
  <text x="34" y="68" class="sub">The events you most want to detect are, by definition, the ones your natural data barely contains.</text>

  <!-- the base rate problem -->
  <rect x="34" y="90" width="392" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="56" y="122" class="lbl">The base-rate problem</text>
  <text x="56" y="150" class="cap">About 1 summary in 15 is factually inconsistent.</text>
  <!-- 20 dots, ~1 red -->
  <g>
    <circle cx="66" cy="182" r="7" fill="#059669"/><circle cx="90" cy="182" r="7" fill="#059669"/><circle cx="114" cy="182" r="7" fill="#059669"/><circle cx="138" cy="182" r="7" fill="#059669"/><circle cx="162" cy="182" r="7" fill="#059669"/><circle cx="186" cy="182" r="7" fill="#059669"/><circle cx="210" cy="182" r="7" fill="#059669"/><circle cx="234" cy="182" r="7" fill="#059669"/><circle cx="258" cy="182" r="7" fill="#059669"/><circle cx="282" cy="182" r="7" fill="#dc2626"/>
    <circle cx="66" cy="208" r="7" fill="#059669"/><circle cx="90" cy="208" r="7" fill="#059669"/><circle cx="114" cy="208" r="7" fill="#059669"/><circle cx="138" cy="208" r="7" fill="#059669"/><circle cx="162" cy="208" r="7" fill="#059669"/><circle cx="186" cy="208" r="7" fill="#059669"/><circle cx="210" cy="208" r="7" fill="#059669"/><circle cx="234" cy="208" r="7" fill="#059669"/><circle cx="258" cy="208" r="7" fill="#059669"/><circle cx="282" cy="208" r="7" fill="#059669"/>
  </g>
  <text x="316" y="188" class="cap">A random 20 gives</text>
  <text x="316" y="206" class="cap">~1 bad example.</text>
  <text x="316" y="224" class="cap">You cannot measure</text>

  <!-- the fix: corrupt a good one -->
  <line x1="428" y1="165" x2="470" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="474" y="90" width="392" height="150" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="496" y="122" class="lbl">Corrupt a known-good summary</text>
  <text x="496" y="150" class="mono">"the fine was 20 million euros"</text>
  <text x="496" y="178" class="cap" fill="#dc2626">number: change 20 to 47</text>
  <text x="496" y="200" class="cap" fill="#dc2626">negate: "was" to "was not"</text>
  <text x="496" y="222" class="cap" fill="#dc2626">entity swap, unsupported sentence</text>

  <!-- pre-labeled -->
  <rect x="210" y="256" width="480" height="70" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="450" y="284" text-anchor="middle" class="lbl">The label comes attached, by construction</text>
  <text x="450" y="308" text-anchor="middle" class="cap">You know it is wrong, which fact broke, and what a correct detector must say.</text>

  <!-- use both -->
  <rect x="34" y="338" width="410" height="66" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="239" y="366" text-anchor="middle" class="lbl">Synthetic: "can the detector detect?"</text>
  <text x="239" y="390" text-anchor="middle" class="cap">Balanced, per-failure-mode, cheap. Use it to improve the system.</text>

  <rect x="456" y="338" width="410" height="66" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="661" y="366" text-anchor="middle" class="lbl">Natural: "what will it cost in production?"</text>
  <text x="661" y="390" text-anchor="middle" class="cap">The real base rate and false-positive burden. Report this to stakeholders.</text>
</svg>
