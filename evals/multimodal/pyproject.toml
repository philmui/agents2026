[project]
name = "multimodal-retrieval-lab"
version = "0.1.0"
description = "A step-by-step multimodal retrieval course with inspectable local experiments."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "qdrant-client>=1.15,<2",
  "python-dotenv>=1.1,<2",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.4,<5",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "reportlab>=4.4,<5",
  "pypdfium2>=4.30,<6",
  "opencv-python-headless>=4.11,<5",
]

[project.optional-dependencies]
models = ["fastembed>=0.7,<1", "llama-index-core>=0.12,<0.15"]
live = ["litellm>=1.75,<2"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "beautifulsoup4>=4.13,<5",
  "nbconvert>=7.16,<8",
  "playwright>=1.51,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
