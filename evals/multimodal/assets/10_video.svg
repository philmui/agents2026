<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Video has two streams and one clock</title><desc id="desc">Hand-authored text and sampled frames follow the energy, controller, and temperature scenes. A hypothetical brief flash illustrates what coarse sampling can miss; it is not an event in the teaching video.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Video has two streams and one clock</text><text x="50" y="140" fill="#202727" font-size="21" font-weight="700">Companion text</text><rect x="230" y="110" width="285" height="70" rx="16" fill="#E5F4EF"/><text x="250" y="154" fill="#202727" font-size="23" font-weight="400">0–4 s: energy chart</text><rect x="535" y="110" width="330" height="70" rx="16" fill="#E5F4EF"/><text x="555" y="154" fill="#202727" font-size="23" font-weight="400">4–8 s: controller</text><rect x="885" y="110" width="265" height="70" rx="16" fill="#E5F4EF"/><text x="905" y="154" fill="#202727" font-size="21" font-weight="400">8–12 s: temperature</text><text x="50" y="275" fill="#202727" font-size="25" font-weight="700">Frames</text><rect x="230" y="220" width="210" height="125" rx="16" fill="#FCEDE6"/><text x="254" y="260" fill="#202727" font-size="27" font-weight="700">0 s</text><text x="254" y="298" fill="#536261" font-size="23" font-weight="400">energy</text><rect x="535" y="220" width="210" height="125" rx="16" fill="#FCEDE6"/><text x="559" y="260" fill="#202727" font-size="27" font-weight="700">4 s</text><text x="559" y="298" fill="#536261" font-size="23" font-weight="400">controller</text><rect x="885" y="220" width="210" height="125" rx="16" fill="#FCEDE6"/><text x="909" y="260" fill="#202727" font-size="27" font-weight="700">8 s</text><text x="909" y="298" fill="#536261" font-size="23" font-weight="400">temperature</text><path d="M230,400 L1150,400" fill="none" stroke="#536261" stroke-width="3"/><circle cx="230" cy="400" r="8" fill="#0B756B"/><circle cx="535" cy="400" r="8" fill="#0B756B"/><circle cx="885" cy="400" r="8" fill="#0B756B"/><text x="230" y="440" fill="#202727" font-size="20" font-weight="400">0 s</text><text x="535" y="440" fill="#202727" font-size="20" font-weight="400">4 s</text><text x="885" y="440" fill="#202727" font-size="20" font-weight="400">8 s</text><rect x="675" y="375" width="24" height="50" rx="16" fill="#C74F3F"/><text x="530" y="505" fill="#C74F3F" font-size="25" font-weight="700">Hypothetical flash: missed between samples.</text><text x="50" y="550" fill="#202727" font-size="24" font-weight="400">Cite the evidence window; do not invent a precise event time.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>