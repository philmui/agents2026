<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Measure finding and answering separately</title><desc id="desc">Retrieval metrics include hit rate, recall, precision, and reciprocal rank. Answer evaluation independently checks claims, numbers, and citations.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Measure finding and answering separately</text><rect x="50" y="135" width="520" height="340" rx="16" fill="#E5F4EF"/><text x="74" y="175" fill="#202727" font-size="27" font-weight="700">Was the evidence retrieved?</text><text x="74" y="213" fill="#536261" font-size="23" font-weight="400">Hit@k: at least one useful source?</text><text x="74" y="246" fill="#536261" font-size="23" font-weight="400">Recall@k: how many relevant sources?</text><text x="74" y="279" fill="#536261" font-size="23" font-weight="400">Precision@k: how much of the list helps?</text><text x="74" y="312" fill="#536261" font-size="23" font-weight="400">MRR: how early is the first useful hit?</text><text x="74" y="345" fill="#536261" font-size="23" font-weight="400"></text><text x="74" y="378" fill="#536261" font-size="23" font-weight="400">Use held-out questions.</text><rect x="630" y="135" width="520" height="340" rx="16" fill="#FCEDE6"/><text x="654" y="175" fill="#202727" font-size="27" font-weight="700">Was the answer supported?</text><text x="654" y="213" fill="#536261" font-size="23" font-weight="400">Correct units and labels?</text><text x="654" y="246" fill="#536261" font-size="23" font-weight="400">Every factual claim supported?</text><text x="654" y="279" fill="#536261" font-size="23" font-weight="400">Citation points to the right source?</text><text x="654" y="312" fill="#536261" font-size="23" font-weight="400">Missing evidence acknowledged?</text><text x="654" y="345" fill="#536261" font-size="23" font-weight="400"></text><text x="654" y="378" fill="#536261" font-size="23" font-weight="400">Audit answers against originals.</text><text x="50" y="540" fill="#202727" font-size="27" font-weight="700">High hit rate does not prove a correct explanation.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>