<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Cosine compares direction</title><desc id="desc">Two illustrative arrows from the origin show vector directions and their angle; a separate card explains unit normalization. A zero vector has no direction.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Cosine compares direction</text><path d="M90,450 L555,450" fill="none" stroke="#536261" stroke-width="2"/><path d="M90,450 L90,140" fill="none" stroke="#536261" stroke-width="2"/><path d="M90,450 L480,170" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><path d="M90,450 L510,345" fill="none" stroke="#C74F3F" stroke-width="3" marker-end="url(#coral)"/><text x="230" y="150" fill="#0B756B" font-size="23" font-weight="700">image vector</text><text x="350" y="420" fill="#C74F3F" font-size="23" font-weight="700">query vector</text><path d="M200,423 Q200,390 180,385" fill="none" stroke="#536261" stroke-width="2"/><text x="218" y="408" fill="#202727" font-size="28" font-weight="400">θ</text><rect x="650" y="140" width="500" height="240" rx="16" fill="#E5F4EF"/><text x="674" y="180" fill="#202727" font-size="27" font-weight="700">After unit normalization</text><text x="674" y="218" fill="#536261" font-size="23" font-weight="400">cosine(q, x) = q · x</text><text x="674" y="251" fill="#536261" font-size="23" font-weight="400">Same direction → 1</text><text x="674" y="284" fill="#536261" font-size="23" font-weight="400">Perpendicular → 0</text><text x="674" y="317" fill="#536261" font-size="23" font-weight="400">Opposite direction → −1</text><rect x="650" y="410" width="500" height="110" rx="16" fill="#FCEDE6"/><text x="674" y="450" fill="#202727" font-size="27" font-weight="700">Zero vector?</text><text x="674" y="488" fill="#536261" font-size="23" font-weight="400">Stop: it has no direction.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>