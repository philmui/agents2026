<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A PDF page can contain several kinds of evidence</title><desc id="desc">A digital PDF may supply a text layer; scanned pages require OCR. Charts and diagrams need rendered page or crop images. All chunks preserve document and page identity.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">A PDF page can contain several kinds of evidence</text><rect x="50" y="210" width="280" height="170" rx="16" fill="#FAFBF8"/><text x="74" y="250" fill="#202727" font-size="27" font-weight="700">PDF page</text><text x="74" y="288" fill="#536261" font-size="23" font-weight="400">Text · table · chart</text><text x="74" y="321" fill="#536261" font-size="23" font-weight="400">or a scanned image</text><path d="M345,255 L400,180" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><path d="M345,335 L400,425" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="420" y="115" width="345" height="155" rx="16" fill="#E5F4EF"/><text x="444" y="155" fill="#202727" font-size="27" font-weight="700">Text route</text><text x="444" y="193" fill="#536261" font-size="23" font-weight="400">Extract text layer</text><text x="444" y="226" fill="#536261" font-size="23" font-weight="400">Use OCR for scanned text</text><rect x="420" y="350" width="345" height="155" rx="16" fill="#FCEDE6"/><text x="444" y="390" fill="#202727" font-size="27" font-weight="700">Visual route</text><text x="444" y="428" fill="#536261" font-size="23" font-weight="400">Render page or crop</text><text x="444" y="461" fill="#536261" font-size="23" font-weight="400">Retain scale + context</text><path d="M780,190 L820,255" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><path d="M780,425 L820,335" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="840" y="210" width="310" height="170" rx="16" fill="#FAFBF8"/><text x="864" y="250" fill="#202727" font-size="27" font-weight="700">Source identity</text><text x="864" y="288" fill="#536261" font-size="23" font-weight="400">document + page</text><text x="864" y="321" fill="#536261" font-size="23" font-weight="400">+ region + version</text><text x="50" y="555" fill="#C74F3F" font-size="24" font-weight="700">A crop without its axis can erase the meaning of a number.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>