<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Train with what was knowable then</title><desc id="desc">At a 10:00 prediction cutoff, a 09:00 sensor reading arriving at 09:02 is allowed. A 09:55 reading arriving at 10:05 and a 10:10 future reading are excluded.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Train with what was knowable then</text><text x="50" y="140" fill="#202727" font-size="30" font-weight="700">Prediction cutoff: 10:00</text><rect x="50" y="200" width="340" height="270" rx="16" fill="#E5F4EF"/><text x="74" y="240" fill="#202727" font-size="27" font-weight="700">Allowed</text><text x="74" y="278" fill="#536261" font-size="23" font-weight="400">Event: 09:00</text><text x="74" y="311" fill="#536261" font-size="23" font-weight="400">Available: 09:02</text><text x="74" y="344" fill="#536261" font-size="23" font-weight="400"></text><text x="74" y="377" fill="#536261" font-size="23" font-weight="400">Both precede cutoff.</text><rect x="430" y="200" width="340" height="270" rx="16" fill="#FCEDE6"/><text x="454" y="240" fill="#202727" font-size="27" font-weight="700">Late arrival</text><text x="454" y="278" fill="#536261" font-size="23" font-weight="400">Event: 09:55</text><text x="454" y="311" fill="#536261" font-size="23" font-weight="400">Available: 10:05</text><text x="454" y="344" fill="#536261" font-size="23" font-weight="400"></text><text x="454" y="377" fill="#536261" font-size="23" font-weight="400">Unknown at 10:00.</text><rect x="810" y="200" width="340" height="270" rx="16" fill="#FCEDE6"/><text x="834" y="240" fill="#202727" font-size="27" font-weight="700">Future reading</text><text x="834" y="278" fill="#536261" font-size="23" font-weight="400">Event: 10:10</text><text x="834" y="311" fill="#536261" font-size="23" font-weight="400">Available: 10:11</text><text x="834" y="344" fill="#536261" font-size="23" font-weight="400"></text><text x="834" y="377" fill="#536261" font-size="23" font-weight="400">Outcome leaks back.</text><text x="50" y="535" fill="#202727" font-size="25" font-weight="700">Check event time AND availability time before choosing a row.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>