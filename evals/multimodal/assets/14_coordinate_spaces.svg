<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Same dimension does not mean same meaning</title><desc id="desc">Two coordinate systems can each have two axes while assigning different meanings to them. Unrelated embedding models cannot be compared by padding or normalization.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Same dimension does not mean same meaning</text><rect x="50" y="145" width="520" height="320" rx="16" fill="#E5F4EF"/><text x="74" y="185" fill="#202727" font-size="27" font-weight="700">Model family A</text><text x="74" y="223" fill="#536261" font-size="23" font-weight="400">Coordinate 1 means “east”</text><text x="74" y="256" fill="#536261" font-size="23" font-weight="400">Coordinate 2 means “north”</text><text x="74" y="289" fill="#536261" font-size="23" font-weight="400"></text><text x="74" y="322" fill="#536261" font-size="23" font-weight="400">[1, 0] points east.</text><rect x="630" y="145" width="520" height="320" rx="16" fill="#FCEDE6"/><text x="654" y="185" fill="#202727" font-size="27" font-weight="700">Model family B</text><text x="654" y="223" fill="#536261" font-size="23" font-weight="400">Coordinate 1 means “north”</text><text x="654" y="256" fill="#536261" font-size="23" font-weight="400">Coordinate 2 means “east”</text><text x="654" y="289" fill="#536261" font-size="23" font-weight="400"></text><text x="654" y="322" fill="#536261" font-size="23" font-weight="400">[1, 0] points north.</text><text x="50" y="535" fill="#536261" font-size="24" font-weight="400">Toy analogy: learned embedding axes are not usually named.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>