<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A · Describe once, search as text</title><desc id="desc">An image becomes a caption before text embedding. Text documents use the same text encoder. The query is encoded with that same model.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">A · Describe once, search as text</text><rect x="50" y="155" width="245" height="145" rx="16" fill="#FCEDE6"/><text x="74" y="195" fill="#202727" font-size="27" font-weight="700">Image</text><text x="74" y="233" fill="#536261" font-size="23" font-weight="400">Chart pixels</text><path d="M310,225 L350,225" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="370" y="155" width="320" height="145" rx="16" fill="#FAFBF8"/><text x="394" y="195" fill="#202727" font-size="27" font-weight="700">Parse</text><text x="394" y="233" fill="#536261" font-size="23" font-weight="400">Caption + extracted values</text><path d="M705,225 L745,225" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="765" y="155" width="385" height="145" rx="16" fill="#E5F4EF"/><text x="789" y="195" fill="#202727" font-size="27" font-weight="700">Text embedding</text><text x="789" y="233" fill="#536261" font-size="23" font-weight="400">Same encoder as questions</text><rect x="50" y="355" width="245" height="130" rx="16" fill="#FAFBF8"/><text x="74" y="395" fill="#202727" font-size="27" font-weight="700">Memo</text><text x="74" y="433" fill="#536261" font-size="23" font-weight="400">Already text</text><path d="M310,420 L350,420" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="370" y="355" width="320" height="130" rx="16" fill="#FAFBF8"/><text x="394" y="395" fill="#202727" font-size="27" font-weight="700">Text chunks</text><text x="394" y="433" fill="#536261" font-size="23" font-weight="400">Keep source IDs</text><path d="M705,420 L745,420" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="765" y="355" width="385" height="130" rx="16" fill="#FAFBF8"/><text x="789" y="395" fill="#202727" font-size="27" font-weight="700">One text index</text><text x="789" y="433" fill="#536261" font-size="23" font-weight="400">Caption vectors + memo vectors</text><path d="M960,315 L960,340" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><text x="50" y="540" fill="#C74F3F" font-size="24" font-weight="700">Missing from the caption → missing from this search representation.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>