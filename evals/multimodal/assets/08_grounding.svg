<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Retrieval is a shortlist, not a verdict</title><desc id="desc">Retrieved evidence must be opened and checked. The answer should identify the source and distinguish a visible measurement from an explanation that requires a memo.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Retrieval is a shortlist, not a verdict</text><rect x="50" y="155" width="310" height="300" rx="16" fill="#E5F4EF"/><text x="74" y="195" fill="#202727" font-size="27" font-weight="700">1 · Retrieve</text><text x="74" y="233" fill="#536261" font-size="23" font-weight="400">Find the solar chart</text><text x="74" y="266" fill="#536261" font-size="23" font-weight="400">using a caption or CLIP</text><text x="74" y="299" fill="#536261" font-size="23" font-weight="400"></text><text x="74" y="332" fill="#536261" font-size="23" font-weight="400">Similarity suggests</text><text x="74" y="365" fill="#536261" font-size="23" font-weight="400">relevance.</text><path d="M375,300 L420,300" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="440" y="155" width="310" height="300" rx="16" fill="#FAFBF8"/><text x="464" y="195" fill="#202727" font-size="27" font-weight="700">2 · Inspect</text><text x="464" y="233" fill="#536261" font-size="23" font-weight="400">Read axis + unit</text><text x="464" y="266" fill="#536261" font-size="23" font-weight="400">Check labels + values</text><text x="464" y="299" fill="#536261" font-size="23" font-weight="400"></text><text x="464" y="332" fill="#536261" font-size="23" font-weight="400">Use original pixels</text><text x="464" y="365" fill="#536261" font-size="23" font-weight="400">or a verified table.</text><path d="M765,300 L810,300" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="830" y="155" width="320" height="300" rx="16" fill="#FCEDE6"/><text x="854" y="195" fill="#202727" font-size="27" font-weight="700">3 · Cite</text><text x="854" y="233" fill="#536261" font-size="23" font-weight="400">Name file + page</text><text x="854" y="266" fill="#536261" font-size="23" font-weight="400">or video timestamp</text><text x="854" y="299" fill="#536261" font-size="23" font-weight="400"></text><text x="854" y="332" fill="#536261" font-size="23" font-weight="400">Separate observation</text><text x="854" y="365" fill="#536261" font-size="23" font-weight="400">from explanation.</text><text x="50" y="530" fill="#202727" font-size="26" font-weight="700">“I cannot read that label” is a useful grounded answer.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>