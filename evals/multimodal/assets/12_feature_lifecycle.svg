<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Features need identity, time, and lineage</title><desc id="desc">A source version produces a parse and an embedding. Historical records and a serving index share the feature definition. A changed source invalidates downstream artifacts.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Features need identity, time, and lineage</text><rect x="50" y="160" width="270" height="170" rx="16" fill="#FAFBF8"/><text x="74" y="200" fill="#202727" font-size="27" font-weight="700">Source version</text><text x="74" y="238" fill="#536261" font-size="23" font-weight="400">source_id + hash</text><text x="74" y="271" fill="#536261" font-size="23" font-weight="400">Observed + available time</text><path d="M335,245 L380,245" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="400" y="160" width="370" height="170" rx="16" fill="#E5F4EF"/><text x="424" y="200" fill="#202727" font-size="27" font-weight="700">Derived feature</text><text x="424" y="238" fill="#536261" font-size="23" font-weight="400">Parser + prompt version</text><text x="424" y="271" fill="#536261" font-size="23" font-weight="400">Embedding model + revision</text><path d="M785,210 L825,155" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><path d="M785,280 L825,395" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="845" y="95" width="305" height="170" rx="16" fill="#FAFBF8"/><text x="869" y="135" fill="#202727" font-size="27" font-weight="700">History</text><text x="869" y="173" fill="#536261" font-size="23" font-weight="400">Reproduce old inputs</text><text x="869" y="206" fill="#536261" font-size="23" font-weight="400">Evaluate past runs</text><rect x="845" y="340" width="305" height="170" rx="16" fill="#FCEDE6"/><text x="869" y="380" fill="#202727" font-size="27" font-weight="700">Serving index</text><text x="869" y="418" fill="#536261" font-size="23" font-weight="400">Find current evidence</text><text x="869" y="451" fill="#536261" font-size="23" font-weight="400">Fast query access</text><text x="50" y="425" fill="#202727" font-size="26" font-weight="700">A changed image needs a new parse and embedding.</text><text x="50" y="475" fill="#536261" font-size="24" font-weight="400">Version the chain, then publish a consistent snapshot.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>