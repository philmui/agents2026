<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">One vision model, two different jobs</title><desc id="desc">Parsing at ingestion creates reusable descriptions. Reading at query time examines a few original images for the specific question.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">One vision model, two different jobs</text><rect x="50" y="140" width="520" height="330" rx="16" fill="#E5F4EF"/><text x="74" y="180" fill="#202727" font-size="27" font-weight="700">1 · Parse at ingestion</text><text x="74" y="218" fill="#536261" font-size="23" font-weight="400">Input: each uploaded chart</text><text x="74" y="251" fill="#536261" font-size="23" font-weight="400">Output: description + table</text><text x="74" y="284" fill="#536261" font-size="23" font-weight="400"></text><text x="74" y="317" fill="#536261" font-size="23" font-weight="400">Pay when content changes</text><text x="74" y="350" fill="#536261" font-size="23" font-weight="400">Purpose: make evidence findable</text><rect x="630" y="140" width="520" height="330" rx="16" fill="#FCEDE6"/><text x="654" y="180" fill="#202727" font-size="27" font-weight="700">2 · Read at query time</text><text x="654" y="218" fill="#536261" font-size="23" font-weight="400">Input: a few retrieved images</text><text x="654" y="251" fill="#536261" font-size="23" font-weight="400">Output: answer + citations</text><text x="654" y="284" fill="#536261" font-size="23" font-weight="400"></text><text x="654" y="317" fill="#536261" font-size="23" font-weight="400">Pay when users ask questions</text><text x="654" y="350" fill="#536261" font-size="23" font-weight="400">Purpose: answer this question</text><text x="70" y="530" fill="#202727" font-size="26" font-weight="700">A description can omit the detail a later question needs.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>