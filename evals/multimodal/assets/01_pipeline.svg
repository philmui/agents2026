<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Find evidence, then answer</title><desc id="desc">Documents and images are encoded into vectors at ingestion. A query retrieves candidates; a reader checks original evidence and cites it.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Find evidence, then answer</text><rect x="50" y="130" width="235" height="155" rx="16" fill="#FAFBF8"/><text x="74" y="170" fill="#202727" font-size="27" font-weight="700">Sources</text><text x="74" y="208" fill="#536261" font-size="23" font-weight="400">Memos · charts</text><text x="74" y="241" fill="#536261" font-size="23" font-weight="400">Screenshots · PDFs</text><path d="M300,205 L345,205" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="365" y="130" width="305" height="155" rx="16" fill="#E5F4EF"/><text x="389" y="170" fill="#202727" font-size="27" font-weight="700">Prepare + encode</text><text x="389" y="208" fill="#536261" font-size="23" font-weight="400">Keep originals</text><text x="389" y="241" fill="#536261" font-size="23" font-weight="400">Store vectors + metadata</text><path d="M685,205 L730,205" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="750" y="130" width="400" height="155" rx="16" fill="#FAFBF8"/><text x="774" y="170" fill="#202727" font-size="27" font-weight="700">Search index</text><text x="774" y="208" fill="#536261" font-size="23" font-weight="400">Compare compatible vectors</text><text x="774" y="241" fill="#536261" font-size="23" font-weight="400">Return candidate IDs</text><rect x="50" y="355" width="235" height="155" rx="16" fill="#FAFBF8"/><text x="74" y="395" fill="#202727" font-size="27" font-weight="700">Question</text><text x="74" y="433" fill="#536261" font-size="23" font-weight="400">“Why did output fall?”</text><path d="M300,430 L345,430" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="365" y="355" width="305" height="155" rx="16" fill="#FCEDE6"/><text x="389" y="395" fill="#202727" font-size="27" font-weight="700">Retrieve</text><text x="389" y="433" fill="#536261" font-size="23" font-weight="400">Select useful candidates</text><text x="389" y="466" fill="#536261" font-size="23" font-weight="400">Apply access filters</text><path d="M685,430 L730,430" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="750" y="355" width="400" height="155" rx="16" fill="#FAFBF8"/><text x="774" y="395" fill="#202727" font-size="27" font-weight="700">Read + cite</text><text x="774" y="433" fill="#536261" font-size="23" font-weight="400">Inspect original evidence</text><text x="774" y="466" fill="#536261" font-size="23" font-weight="400">Answer or state uncertainty</text><path d="M950,300 V325 H520 V340" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>