<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">C · Search separately, fuse ranks</title><desc id="desc">One query enters two compatible encoders. A text store and an image store return lists; reciprocal rank fusion combines ranks, not raw scores.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">C · Search separately, fuse ranks</text><rect x="50" y="250" width="220" height="140" rx="16" fill="#FAFBF8"/><text x="74" y="290" fill="#202727" font-size="27" font-weight="700">Question</text><text x="74" y="328" fill="#536261" font-size="23" font-weight="400">One user intent</text><path d="M285,285 L335,200" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><path d="M285,355 L335,440" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="355" y="135" width="345" height="130" rx="16" fill="#FCEDE6"/><text x="379" y="175" fill="#202727" font-size="27" font-weight="700">Text encoder → text store</text><text x="379" y="213" fill="#536261" font-size="23" font-weight="400">Memos + searchable text</text><rect x="355" y="375" width="345" height="130" rx="16" fill="#E5F4EF"/><text x="379" y="415" fill="#202727" font-size="27" font-weight="700">CLIP text → image store</text><text x="379" y="453" fill="#536261" font-size="23" font-weight="400">Image vectors</text><path d="M715,200 L775,285" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><path d="M715,440 L775,355" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="795" y="250" width="355" height="140" rx="16" fill="#FAFBF8"/><text x="819" y="290" fill="#202727" font-size="27" font-weight="700">Fuse ranked lists</text><text x="819" y="328" fill="#536261" font-size="23" font-weight="400">Preserve source identity</text><text x="355" y="325" fill="#C74F3F" font-size="28" font-weight="700">0.83 here ≠ 0.83 there</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>