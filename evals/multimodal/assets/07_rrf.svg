<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Reciprocal rank fusion rewards agreement</title><desc id="desc">A chart ranked second in a text list and first in an image list gets two reciprocal-rank contributions. Duplicate appearances within one list count only once.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">Reciprocal rank fusion rewards agreement</text><rect x="50" y="140" width="340" height="260" rx="16" fill="#FCEDE6"/><text x="74" y="180" fill="#202727" font-size="27" font-weight="700">Caption text list</text><text x="74" y="218" fill="#536261" font-size="23" font-weight="400">1 · memo</text><text x="74" y="251" fill="#536261" font-size="23" font-weight="400">2 · solar chart</text><text x="74" y="284" fill="#536261" font-size="23" font-weight="400">3 · water chart</text><rect x="440" y="140" width="340" height="260" rx="16" fill="#E5F4EF"/><text x="464" y="180" fill="#202727" font-size="27" font-weight="700">Image list</text><text x="464" y="218" fill="#536261" font-size="23" font-weight="400">1 · solar chart</text><text x="464" y="251" fill="#536261" font-size="23" font-weight="400">2 · temperature chart</text><text x="464" y="284" fill="#536261" font-size="23" font-weight="400">3 · water chart</text><rect x="830" y="140" width="320" height="260" rx="16" fill="#FAFBF8"/><text x="854" y="180" fill="#202727" font-size="27" font-weight="700">Solar chart</text><text x="854" y="218" fill="#536261" font-size="23" font-weight="400">1 / (60 + 2)</text><text x="854" y="251" fill="#536261" font-size="23" font-weight="400">+ 1 / (60 + 1)</text><text x="854" y="284" fill="#536261" font-size="23" font-weight="400">= 0.03252</text><text x="50" y="470" fill="#202727" font-size="27" font-weight="700">Each unique source contributes once per ranked list.</text><text x="50" y="520" fill="#C74F3F" font-size="25" font-weight="400">Two crops of one page are not two independent votes.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>