<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">B · Learn one shared coordinate system</title><desc id="desc">The matching CLIP text and image towers map text questions and images into a jointly learned space. The vectors are compared to retrieve images.</desc><defs><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0B756B"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#C74F3F"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="50" y="65" fill="#202727" font-size="36" font-weight="700">B · Learn one shared coordinate system</text><rect x="50" y="140" width="300" height="140" rx="16" fill="#FCEDE6"/><text x="74" y="180" fill="#202727" font-size="27" font-weight="700">Text question</text><text x="74" y="218" fill="#536261" font-size="23" font-weight="400">“a rising line chart”</text><path d="M365,210 L405,210" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="425" y="140" width="330" height="140" rx="16" fill="#FAFBF8"/><text x="449" y="180" fill="#202727" font-size="27" font-weight="700">CLIP text tower</text><text x="449" y="218" fill="#536261" font-size="23" font-weight="400">Encode the question</text><rect x="50" y="340" width="300" height="140" rx="16" fill="#E5F4EF"/><text x="74" y="380" fill="#202727" font-size="27" font-weight="700">Image</text><text x="74" y="418" fill="#536261" font-size="23" font-weight="400">Actual pixels</text><path d="M365,410 L405,410" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="425" y="340" width="330" height="140" rx="16" fill="#FAFBF8"/><text x="449" y="380" fill="#202727" font-size="27" font-weight="700">CLIP image tower</text><text x="449" y="418" fill="#536261" font-size="23" font-weight="400">Encode the image</text><path d="M770,210 L810,210" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><path d="M770,410 L810,410" fill="none" stroke="#0B756B" stroke-width="3" marker-end="url(#teal)"/><rect x="830" y="140" width="320" height="340" rx="16" fill="#FAFBF8"/><text x="855" y="180" fill="#202727" font-size="28" font-weight="700">Shared space</text><circle cx="900" cy="260" r="12" fill="#0B756B"/><circle cx="960" cy="280" r="12" fill="#C74F3F"/><circle cx="1020" cy="375" r="12" fill="#0B756B"/><circle cx="1070" cy="390" r="12" fill="#C74F3F"/><text x="855" y="450" fill="#536261" font-size="22" font-weight="400">Compare directions</text><text x="50" y="540" fill="#202727" font-size="25" font-weight="700">Paired training creates meaning; equal vector length does not.</text><text x="50" y="590" fill="#536261" font-size="17" font-weight="400">Multimodal retrieval · school solar lab</text></g></svg>