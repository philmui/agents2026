<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">A failure diagnosis sequence</title><desc id="desc">Check retrieval coverage first. If gold evidence was available, check sentence citations. If citations are correct, inspect answer reasoning or answer formatting. The path gives likely failure categories, not causal proof.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="25" y="70" width="250" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="150.0" y="109" text-anchor="middle" class="title">Evidence found?</text><text x="150.0" y="142" text-anchor="middle" class="small">Inspect retrieved facts</text><path d="M280 122 L325 122" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="70" width="250" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="455.0" y="109" text-anchor="middle" class="title">Gold facts cited?</text><text x="455.0" y="142" text-anchor="middle" class="small">Inspect predicted SP</text><path d="M585 122 L630 122" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="635" y="70" width="240" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="755.0" y="109" text-anchor="middle" class="title">Answer correct?</text><text x="755.0" y="142" text-anchor="middle" class="small">Inspect short answer</text><text x="50" y="250" class="">No: retrieval gap</text><text x="350" y="285" class="">No: evidence selection</text><text x="655" y="320" class="">No: reasoning / format</text></svg>