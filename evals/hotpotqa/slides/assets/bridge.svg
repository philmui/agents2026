<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">A bridge question</title><desc id="desc">The invented book Lantern Atlas identifies its creator Mira Vale. Mira Vale’s sentence identifies Harbor City as her birthplace. The bridge entity is Mira Vale.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="20" y="70" width="250" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="145.0" y="109" text-anchor="middle" class="title">Lantern Atlas</text><text x="145.0" y="142" text-anchor="middle" class="small">creator is Mira Vale</text><path d="M275 123 L325 123" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="70" width="240" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="450.0" y="109" text-anchor="middle" class="title">Mira Vale</text><text x="450.0" y="142" text-anchor="middle" class="small">born in Harbor City</text><path d="M575 123 L625 123" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="70" width="250" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="755.0" y="109" text-anchor="middle" class="title">Harbor City</text><text x="755.0" y="142" text-anchor="middle" class="small">answer</text><text x="335" y="240" class="accent">Bridge entity</text><text x="80" y="315" class="">Each hop supplies a fact needed by the next part of the question.</text></svg>