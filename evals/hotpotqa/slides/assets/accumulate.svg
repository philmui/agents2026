<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Evidence across retrieval rounds</title><desc id="desc">Round one retrieves paragraphs A and C. Round two retrieves paragraphs B and A. The union passed to generation is A, C and B with duplicates removed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="25" y="40" width="340" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="195.0" y="79" text-anchor="middle" class="title">Round 1</text><text x="195.0" y="112" text-anchor="middle" class="small">Lantern Atlas + Cloud Almanac</text><rect x="25" y="210" width="340" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="195.0" y="249" text-anchor="middle" class="title">Round 2</text><text x="195.0" y="282" text-anchor="middle" class="small">Mira Vale + Lantern Atlas</text><path d="M370 92 L485 92" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M485 92 L485 155" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 262 L485 262" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M485 262 L485 205" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="125" width="355" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="697.5" y="164" text-anchor="middle" class="title">Evidence union</text><text x="697.5" y="197" text-anchor="middle" class="small">Lantern Atlas + Cloud + Mira</text></svg>