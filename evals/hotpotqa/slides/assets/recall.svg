<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Gold paragraph recall example</title><desc id="desc">The gold title set contains A and B. The retrieval contains A and C. One of the two gold titles was found, so recall is one half. All-gold success is zero.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><text x="30" y="50" class="title">Gold titles</text><rect x="30" y="75" width="230" height="95" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="145.0" y="114" text-anchor="middle" class="title">A</text><rect x="290" y="75" width="230" height="95" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="405.0" y="114" text-anchor="middle" class="title">B</text><text x="30" y="230" class="title">Retrieved titles</text><rect x="30" y="255" width="230" height="95" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="145.0" y="294" text-anchor="middle" class="title">A</text><rect x="290" y="255" width="230" height="95" rx="8" fill="#fff0d7" stroke="#006d70" stroke-width="2"/><text x="405.0" y="294" text-anchor="middle" class="title">C</text><text x="595" y="125" class="accent">Recall = 1 / 2</text><text x="595" y="280" class="accent">All-gold = 0</text></svg>