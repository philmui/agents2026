<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Paragraph retrieval preserves sentences</title><desc id="desc">Paragraphs are the ranking unit. Every paragraph preserves a list of numbered sentences. Selected paragraphs are passed to the model with these original coordinates.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="20" y="70" width="260" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="150.0" y="109" text-anchor="middle" class="title">Paragraph A</text><text x="150.0" y="142" text-anchor="middle" class="small">title + all sentences</text><rect x="330" y="70" width="260" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="460.0" y="109" text-anchor="middle" class="title">Paragraph B</text><text x="460.0" y="142" text-anchor="middle" class="small">title + all sentences</text><rect x="640" y="70" width="240" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="760.0" y="109" text-anchor="middle" class="title">Paragraph C</text><text x="760.0" y="142" text-anchor="middle" class="small">title + all sentences</text><text x="45" y="240" class="">[A, 0]   [A, 1]</text><text x="355" y="240" class="">[B, 0]   [B, 1]</text><text x="665" y="240" class="">[C, 0]</text><text x="65" y="325" class="">Rank paragraphs first. Ask the generator to cite individual sentences.</text></svg>