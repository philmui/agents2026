<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Bounded LangGraph RAG workflow</title><desc id="desc">Retrieve then grade. Sufficient evidence goes directly to generation. Insufficient evidence rewrites and retrieves again only while rounds remain. At the round limit, grade routes directly to generation without a rewrite.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="25" y="40" width="215" height="95" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="132.5" y="79" text-anchor="middle" class="title">retrieve</text><text x="132.5" y="112" text-anchor="middle" class="small">round += 1</text><path d="M245 87 L310 87" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="40" width="245" height="95" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="437.5" y="79" text-anchor="middle" class="title">grade</text><text x="437.5" y="112" text-anchor="middle" class="small">Enough evidence?</text><path d="M565 87 L660 87" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="665" y="40" width="210" height="95" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="770.0" y="79" text-anchor="middle" class="title">generate</text><text x="770.0" y="112" text-anchor="middle" class="small">answer + citations</text><text x="577" y="57" class="small">yes</text><path d="M435 140 L435 225" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="230" width="245" height="95" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="437.5" y="269" text-anchor="middle" class="title">rewrite</text><text x="437.5" y="302" text-anchor="middle" class="small">if rounds remain</text><path d="M310 277 H130 V140" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><text x="265" y="196" class="small">no: retry</text><path d="M535 140 V210 H772 V140" fill="none" stroke="#9a480f" stroke-width="3" marker-end="url(#arrow)"/><text x="588" y="193" class="small">no: limit</text></svg>