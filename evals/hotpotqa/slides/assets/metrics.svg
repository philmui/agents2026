<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Three evaluation targets</title><desc id="desc">Retrieval asks whether gold evidence was available. Supporting fact scoring asks whether the output selected the gold sentences. Answer scoring asks whether the short answer matches.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="20" y="70" width="265" height="125" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="152.5" y="109" text-anchor="middle" class="title">Retrieval</text><text x="152.5" y="142" text-anchor="middle" class="small">What reached the generator?</text><rect x="318" y="70" width="265" height="125" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="450.5" y="109" text-anchor="middle" class="title">Supporting facts</text><text x="450.5" y="142" text-anchor="middle" class="small">Which sentences were cited?</text><rect x="615" y="70" width="265" height="125" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="747.5" y="109" text-anchor="middle" class="title">Answer</text><text x="747.5" y="142" text-anchor="middle" class="small">What did the system say?</text><text x="45" y="280" class="">Custom diagnostics</text><text x="345" y="280" class="">Official SP scores</text><text x="642" y="280" class="">Official answer scores</text><text x="325" y="340" class="">Joint scores combine answer and SP performance.</text></svg>