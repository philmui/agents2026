<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Paired experiment design</title><desc id="desc">The same frozen question IDs feed configurations A and B. Both predictions use the same scorer, and per-question differences drive comparison.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="25" y="125" width="250" height="110" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="150.0" y="164" text-anchor="middle" class="title">Frozen question IDs</text><text x="150.0" y="197" text-anchor="middle" class="small">same candidate contexts</text><path d="M280 180 L360 180" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 180 L360 80" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 180 L360 285" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="30" width="210" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="505.0" y="69" text-anchor="middle" class="title">System A</text><text x="505.0" y="102" text-anchor="middle" class="small">k = 2</text><rect x="400" y="235" width="210" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="505.0" y="274" text-anchor="middle" class="title">System B</text><text x="505.0" y="307" text-anchor="middle" class="small">k = 4</text><path d="M615 80 L720 80" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 80 L720 180" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 285 L720 285" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 285 L720 210" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="170" class="">Paired</text><text x="750" y="205" class="">scores</text></svg>