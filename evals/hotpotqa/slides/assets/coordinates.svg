<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Original sentence coordinates</title><desc id="desc">A paragraph title names the record. Sentence indices start at zero and stay attached to original sentences. The supporting fact is the exact title and index pair.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><text x="35" y="45" class="title">Paragraph title: Mira Vale</text><rect x="40" y="85" width="100" height="65" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="90.0" y="124" text-anchor="middle" class="title">0</text><text x="165" y="127" class="">Mira Vale was born in Harbor City.</text><rect x="40" y="180" width="100" height="65" rx="8" fill="#fff0d7" stroke="#006d70" stroke-width="2"/><text x="90.0" y="219" text-anchor="middle" class="title">1</text><text x="165" y="222" class="">A later sentence, if present, keeps index 1.</text><text x="55" y="325" class="accent">Citation coordinate: [&quot;Mira Vale&quot;, 0]</text></svg>