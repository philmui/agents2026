<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">The label boundary</title><desc id="desc">Question and context flow into the agent. Answer and supporting fact labels flow into the evaluator. Only predictions flow from the agent to the evaluator.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="20" y="30" width="280" height="100" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="160.0" y="69" text-anchor="middle" class="title">Agent input</text><text x="160.0" y="102" text-anchor="middle" class="small">question + context</text><path d="M305 80 L380 80" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="30" width="210" height="100" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="490.0" y="69" text-anchor="middle" class="title">RAG agent</text><text x="490.0" y="102" text-anchor="middle" class="small">no gold labels</text><path d="M490 135 L490 235" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="240" width="260" height="100" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="515.0" y="279" text-anchor="middle" class="title">Evaluator</text><text x="515.0" y="312" text-anchor="middle" class="small">compare predictions</text><rect x="20" y="240" width="280" height="100" rx="8" fill="#fff0d7" stroke="#006d70" stroke-width="2"/><text x="160.0" y="279" text-anchor="middle" class="title">Gold labels</text><text x="160.0" y="312" text-anchor="middle" class="small">answer + supporting_facts</text><path d="M305 290 L380 290" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><text x="660" y="285" class="">type / level:</text><text x="660" y="319" class="">analysis only</text></svg>