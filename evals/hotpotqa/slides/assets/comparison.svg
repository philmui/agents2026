<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">A comparison question</title><desc id="desc">Two invented records say River Theater opened in 1902 and Hill Theater in 1921. Compare dates to answer River Theater.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="30" y="30" width="315" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="187.5" y="69" text-anchor="middle" class="title">River Theater</text><text x="187.5" y="102" text-anchor="middle" class="small">opened in 1902</text><rect x="30" y="205" width="315" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="187.5" y="244" text-anchor="middle" class="title">Hill Theater</text><text x="187.5" y="277" text-anchor="middle" class="small">opened in 1921</text><path d="M350 83 L470 83" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 83 L470 165" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 258 L470 258" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 258 L470 200" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="500" y="125" width="340" height="105" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="670.0" y="164" text-anchor="middle" class="title">Compare dates</text><text x="670.0" y="197" text-anchor="middle" class="small">1902 comes before 1921</text></svg>