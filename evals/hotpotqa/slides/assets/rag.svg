<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Retrieval augmented generation</title><desc id="desc">A question retrieves source paragraphs. A generator reads those paragraphs to produce an answer and citations. The evaluator checks retrieval and final output separately.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><rect x="20" y="70" width="220" height="100" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="130.0" y="109" text-anchor="middle" class="title">Question</text><text x="130.0" y="142" text-anchor="middle" class="small">What is being asked?</text><path d="M245 120 L320 120" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="70" width="245" height="100" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="447.5" y="109" text-anchor="middle" class="title">Retriever</text><text x="447.5" y="142" text-anchor="middle" class="small">Find source paragraphs</text><path d="M575 120 L650 120" fill="none" stroke="#006d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="655" y="70" width="225" height="100" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="767.5" y="109" text-anchor="middle" class="title">Generator</text><text x="767.5" y="142" text-anchor="middle" class="small">Answer with citations</text><text x="335" y="230" class="">Evidence available</text><text x="660" y="270" class="">Evidence selected</text><text x="95" y="330" class="">Evaluation checks both the information found and the answer produced.</text></svg>