<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Distractor and fullwiki retrieval</title><desc id="desc">Distractor retrieval chooses from ten supplied paragraphs for each question, including two gold paragraphs. Fullwiki retrieval searches the Wikipedia corpus. The top ten in the fullwiki JSON are baseline retrieval results.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><text x="25" y="40" class="title">Distractor</text><text x="475" y="40" class="title">Fullwiki</text><rect x="25" y="75" width="62" height="58" rx="4" fill="#e6f1ed" stroke="#006d70"/><text x="56" y="112" text-anchor="middle" style="fill:#172b34">1</text><rect x="102" y="75" width="62" height="58" rx="4" fill="#006d70" stroke="#006d70"/><text x="133" y="112" text-anchor="middle" style="fill:white">2</text><rect x="179" y="75" width="62" height="58" rx="4" fill="#e6f1ed" stroke="#006d70"/><text x="210" y="112" text-anchor="middle" style="fill:#172b34">3</text><rect x="256" y="75" width="62" height="58" rx="4" fill="#e6f1ed" stroke="#006d70"/><text x="287" y="112" text-anchor="middle" style="fill:#172b34">4</text><rect x="333" y="75" width="62" height="58" rx="4" fill="#e6f1ed" stroke="#006d70"/><text x="364" y="112" text-anchor="middle" style="fill:#172b34">5</text><rect x="25" y="155" width="62" height="58" rx="4" fill="#e6f1ed" stroke="#006d70"/><text x="56" y="192" text-anchor="middle" style="fill:#172b34">6</text><rect x="102" y="155" width="62" height="58" rx="4" fill="#e6f1ed" stroke="#006d70"/><text x="133" y="192" text-anchor="middle" style="fill:#172b34">7</text><rect x="179" y="155" width="62" height="58" rx="4" fill="#006d70" stroke="#006d70"/><text x="210" y="192" text-anchor="middle" style="fill:white">8</text><rect x="256" y="155" width="62" height="58" rx="4" fill="#e6f1ed" stroke="#006d70"/><text x="287" y="192" text-anchor="middle" style="fill:#172b34">9</text><rect x="333" y="155" width="62" height="58" rx="4" fill="#e6f1ed" stroke="#006d70"/><text x="364" y="192" text-anchor="middle" style="fill:#172b34">10</text><rect x="475" y="80" width="380" height="110" rx="8" fill="#e6f1ed" stroke="#006d70" stroke-width="2"/><text x="665.0" y="119" text-anchor="middle" class="title">Wikipedia corpus</text><text x="665.0" y="152" text-anchor="middle" class="small">Retrieve your own candidates</text><text x="25" y="290" class="">10 supplied paragraphs</text><text x="25" y="327" class="">2 gold + 8 distractors</text><text x="475" y="290" class="">Gold paragraphs can be missed</text><text x="475" y="327" class="">Top-10 JSON ≠ whole corpus</text></svg>