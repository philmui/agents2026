<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Sparse TF-IDF similarity</title><desc id="desc">Question terms and paragraph terms share a sparse vocabulary. Cosine similarity ranks the paragraph vectors. The example weights are illustrative and are not measured results.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006d70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b34;font-size:23px}.small{font-size:19px}.title{font-size:27px;font-weight:bold}.accent{fill:#006d70;font-weight:bold}</style><text x="25" y="45" class="title">Shared vocabulary: lantern, atlas, creator, mira, vale</text><text x="30" y="110" class="">Question</text><text x="275" y="110" class="">[0.5, 0.5, 0.7, 0.0, 0.0]</text><text x="30" y="170" class="">Paragraph A</text><text x="275" y="170" class="">[0.4, 0.4, 0.0, 0.5, 0.5]</text><text x="30" y="230" class="">Paragraph B</text><text x="275" y="230" class="">[0.0, 0.0, 0.0, 0.7, 0.7]</text><text x="35" y="320" class="accent">Words absent from the question can make the second hop hard to rank.</text></svg>