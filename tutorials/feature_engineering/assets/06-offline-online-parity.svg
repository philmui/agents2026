<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How to test that historical and live feature paths agree</title>
  <desc id="desc">One feature rule is run through a historical batch path and a live lookup path for customer 17850 at the same cutoff. Both should return 105 pounds. The comparison must also check missing values, units, data types, and feature age.</desc>
  <defs><marker id="arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1L12 7L1 13Z" fill="#17211b"/></marker><style>.title{font:700 34px Inter,Arial,sans-serif;fill:#17211b}.sub{font:400 18px Inter,Arial,sans-serif;fill:#41504a}.head{font:700 20px Inter,Arial,sans-serif;fill:#17211b}.body{font:400 16px Inter,Arial,sans-serif;fill:#41504a}.small{font:700 13px Inter,Arial,sans-serif;fill:#41504a}.mono{font:500 16px ui-monospace,Menlo,monospace;fill:#17211b}.line{stroke:#17211b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#fffdf7"/>
  <text x="60" y="58" class="title">A fair comparison holds the question still</text>
  <text x="60" y="88" class="sub">“Parity” simply means that the training path and live path agree.</text>

  <g transform="translate(60 143)">
    <rect width="260" height="188" rx="22" fill="#f4d35e" stroke="#17211b" stroke-width="3"/>
    <text x="24" y="39" class="head">Same question</text>
    <text x="24" y="77" class="small">FEATURE RULE</text><text x="24" y="103" class="body">spend in prior 30 days</text>
    <text x="24" y="137" class="mono">customer = 17850</text><text x="24" y="164" class="mono">cutoff = Jun 1</text>
  </g>

  <path d="M330 207C380 207 390 190 430 190" class="line"/>
  <path d="M330 267C380 267 390 407 430 407" class="line"/>

  <g transform="translate(442 120)">
    <rect width="298" height="150" rx="20" fill="#dff7ef" stroke="#008f83" stroke-width="3"/>
    <text x="24" y="38" class="head">Historical batch path</text>
    <text x="24" y="70" class="body">Rebuild the old feature.</text>
    <rect x="24" y="91" width="250" height="38" rx="9" fill="#fff"/><text x="42" y="116" class="mono">result = £105.00</text>
  </g>
  <g transform="translate(442 337)">
    <rect width="298" height="150" rx="20" fill="#ffe9e5" stroke="#d94f45" stroke-width="3"/>
    <text x="24" y="38" class="head">Live lookup path</text>
    <text x="24" y="70" class="body">Replay the same cutoff.</text>
    <rect x="24" y="91" width="250" height="38" rx="9" fill="#fff"/><text x="42" y="116" class="mono">result = £105.00</text>
  </g>

  <path d="M750 195C801 195 804 267 846 267" class="line"/>
  <path d="M750 412C801 412 804 323 846 323" class="line"/>
  <g transform="translate(858 192)">
    <rect width="282" height="232" rx="22" fill="#fff" stroke="#17211b" stroke-width="3"/>
    <circle cx="141" cy="55" r="35" fill="#008f83"/><path d="M124 55L137 68L160 40" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="118" class="head">Values agree</text>
    <text x="35" y="151" class="mono">£105.00 = £105.00</text>
    <text x="35" y="184" class="body">Same customer and cutoff</text>
    <text x="35" y="208" class="body">make this a valid test.</text>
  </g>

  <g transform="translate(172 543)">
    <rect width="856" height="80" rx="18" fill="#17211b"/>
    <text x="27" y="31" style="font:700 18px Inter,Arial,sans-serif;fill:#fff">Matching numbers are necessary, but check the details too</text>
    <text x="27" y="58" style="font:400 16px Inter,Arial,sans-serif;fill:#d8e0dc">missing value rules · pounds versus pence · number type · how old the feature is</text>
  </g>
</svg>
