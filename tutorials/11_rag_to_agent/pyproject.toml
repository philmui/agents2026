[project]
name = "asdrp-tutorial-module-11"
version = "0.1.0"
description = "ASDRP Agentic RAG Evaluation track — Module 11: From RAG to Agent + agent metrics."
requires-python = ">=3.13"
dependencies = [
    # Cloud LLM + embeddings
    "langchain-ollama",
    "litellm",
    # Vector store
    "langchain-qdrant",
    "qdrant-client",
    # Reranking (search_metal_knowledge uses Cohere rerank)
    "cohere",
    # Agent loop
    "langgraph",
    # Live price tool
    "requests",
    # Fuzzy matching used by ToolCallF1 internally
    "rapidfuzz",
    # Evaluation
    "ragas",
    "nest-asyncio",
    # Utilities
    "pandas",
    "python-dotenv",
    # Jupyter tooling so `uv run jupyter lab` works out of the box.
    "jupyterlab",
    "ipykernel",
]

# `uv sync` reads this file, creates a .venv, and installs the pinned set above.
# No [build-system] table: this is a tutorial project, not a package to publish.
[tool.uv]
package = false
